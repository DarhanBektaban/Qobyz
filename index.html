<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qobyz.com — Qobyz Yrghaghy</title>
  <style>
    :root {
      --bg: #0a0807;
      --panel: #161210;
      --accent: #d4a373;
      --glow: #ffc872;
      --wood: #1e0d07;
      --skin: #bda084;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: #e6e2dd; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; touch-action: none; }

    header { text-align: center; padding: 14px 10px 4px; z-index: 10; }
    h1 { color: var(--accent); letter-spacing: 2px; font-size: 1.5rem; text-transform: uppercase; margin-bottom: 2px; }
    p { color: #8c827a; font-size: 0.82rem; max-width: 500px; }

    /* Yrghaq Taikter */
    .rhythm-bar {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .r-btn {
      padding: 6px 14px;
      background: var(--panel);
      border: 1px solid #332720;
      color: #b5a497;
      font-size: 0.78rem;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }
    .r-btn.active {
      background: var(--accent);
      color: #0c0a09;
      font-weight: bold;
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(212, 163, 115, 0.4);
    }

    .btn-box { margin-top: 8px; display: flex; gap: 8px; justify-content: center; }
    .btn { padding: 8px 18px; background: var(--accent); color: #0c0a09; font-weight: 600; font-size: 0.8rem; border: none; border-radius: 4px; cursor: pointer; }
    .btn-hold { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
    .btn-hold.active { background: var(--accent); color: #0c0a09; box-shadow: 0 0 12px var(--glow); }

    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
      opacity: 0.35;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .stage.ready { opacity: 1; pointer-events: auto; }

    .qobyz-head { width: 50px; height: 68px; background: #140804; border-radius: 8px 8px 0 0; position: relative; }
    .peg { width: 14px; height: 8px; background: #000; position: absolute; }
    .peg.l { left: -10px; top: 16px; }
    .peg.r { right: -10px; top: 36px; }

    .qobyz-neck {
      width: 54px;
      height: 380px;
      background: linear-gradient(90deg, #0e0503, #220e07, #0e0503);
      position: relative;
      box-shadow: inset 0 0 16px rgba(0,0,0,0.95);
    }

    .qobyz-body {
      width: 216px;
      height: 260px;
      background: radial-gradient(circle at 50% 30%, #36190e, #0e0503 85%);
      border-radius: 42% 42% 46% 46%;
      margin-top: -24px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 20px;
      position: relative;
    }

    .qobyz-skin {
      width: 164px;
      height: 140px;
      background: radial-gradient(circle, var(--skin), #73573f);
      border-radius: 12px 12px 46% 46%;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.7);
    }

    .qobyz-bridge {
      width: 42px;
      height: 14px;
      background: #090302;
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 3px;
    }

    .touch-lane { position: absolute; top: 0; height: 100%; width: 27px; cursor: pointer; display: flex; justify-content: center; }
    .touch-lane.l { left: 0; }
    .touch-lane.r { right: 0; }

    .wire {
      width: 4px;
      height: 480px;
      background: #a39281;
      position: absolute;
      top: -24px;
      pointer-events: none;
    }
    .wire.bass { width: 6.5px; }

    .touch-lane.active .wire {
      background: #fff;
      box-shadow: 0 0 14px var(--glow);
    }

    .touch-indicator {
      width: 18px;
      height: 9px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      opacity: 0;
      box-shadow: 0 0 12px var(--glow);
    }
    .touch-lane.active .touch-indicator { opacity: 1; }

    .readout { margin-top: 10px; font-size: 0.82rem; color: #998e84; display: flex; gap: 20px; }
    .readout span { color: var(--glow); font-family: monospace; }
  </style>
</head>
<body>

  <header>
    <h1>Qobyz Yrghaghy Men Shrtikhtary</h1>
    <p>Ysqyshtyn serpinin tandagnyz: erkin tartuu, tolghau tynysy nemese dubir zhelisi.</p>
    
    <div class="rhythm-bar">
      <button class="r-btn active" onclick="setRhythm('free', this)">Еркін тарту (Созылмалы)</button>
      <button class="r-btn" onclick="setRhythm('tolghau', this)">Толғау тынысы (Баяу толқын)</button>
      <button class="r-btn" onclick="setRhythm('dubir', this)">Дүбір (Жорға шабыс)</button>
      <button class="r-btn" onclick="setRhythm('aqqu', this)">Аққу қанаты (Желпініс)</button>
    </div>

    <div class="btn-box">
      <button class="btn" id="startBtn" onclick="initAudio()">Дыбысты Қосу</button>
      <button class="btn btn-hold" id="holdBtn" onclick="toggleHold()">Сол қылды бекіту (Hold)</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="qobyz-head">
      <div class="peg l"></div>
      <div class="peg r"></div>
    </div>
    
    <div class="qobyz-neck" id="neck">
      <div class="touch-lane l" id="lane-l">
        <div class="wire bass"></div>
        <div class="touch-indicator" id="ind-l"></div>
      </div>
      <div class="touch-lane r" id="lane-r">
        <div class="wire"></div>
        <div class="touch-indicator" id="ind-r"></div>
      </div>
    </div>

    <div class="qobyz-body">
      <div class="qobyz-skin">
        <div class="qobyz-bridge"></div>
      </div>
    </div>
  </div>

  <div class="readout">
    <div>Тоғанақ (D3): <span id="label-l">—</span></div>
    <div>Кілтең (A3): <span id="label-r">—</span></div>
  </div>

  <script>
    let actx = null;
    let horsehairWave = null;
    let bowNoiseBuffer = null;
    let currentRhythm = 'free'; // free, tolghau, dubir, aqqu

    function setRhythm(type, btn) {
      currentRhythm = type;
      document.querySelectorAll('.r-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function getAudioContext() {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        buildSpectralModel();
      }
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }

    function buildSpectralModel() {
      const harmonics = 32;
      const real = new Float32Array(harmonics);
      const imag = new Float32Array(harmonics);
      real[0] = 0;
      imag[0] = 0;

      for (let n = 1; n < harmonics; n++) {
        let amp = 1 / Math.pow(n, 0.95);
        if (n % 2 !== 0) amp *= 1.35;
        if (n >= 3 && n <= 6) amp *= 1.4;
        imag[n] = amp;
      }
      horsehairWave = actx.createPeriodicWave(real, imag, { disableNormalization: false });

      const bSize = actx.sampleRate * 2;
      bowNoiseBuffer = actx.createBuffer(1, bSize, actx.sampleRate);
      const d = bowNoiseBuffer.getChannelData(0);
      for (let i = 0; i < bSize; i++) {
        d[i] = (Math.random() * 2 - 1) * 0.45;
      }
    }

    function initAudio() {
      getAudioContext();
      document.getElementById('stage').classList.add('ready');
      document.getElementById('startBtn').style.display = 'none';
    }

    class RhythmicQobyzVoice {
      constructor(baseFreq) {
        this.baseFreq = baseFreq;
        this.ctx = getAudioContext();
        this.voice = null;
      }

      play(freq, isBass = false) {
        this.stop();
        const t = this.ctx.currentTime;

        const o1 = this.ctx.createOscillator();
        const o2 = this.ctx.createOscillator();
        o1.setPeriodicWave(horsehairWave);
        o2.setPeriodicWave(horsehairWave);

        o1.frequency.setValueAtTime(freq, t);
        o2.frequency.setValueAtTime(freq + (isBass ? 0.45 : 0.7), t);

        // Қол вибратосы
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        lfo.frequency.setValueAtTime(isBass ? 3.8 : 4.6, t);
        lfoGain.gain.setValueAtTime(freq * 0.011, t);
        lfo.connect(o1.frequency);
        lfo.connect(o2.frequency);
        lfo.start(t);

        // ЫРҒАҚТЫҚ ТРЕМОР / ЫСҚЫШ СЕРПІНІ (Rhythm Modulator)
        const rhythmOsc = this.ctx.createOscillator();
        const rhythmGain = this.ctx.createGain();

        // Ырғақ түрлеріне қарай модуляцияны баптау
        if (currentRhythm === 'free') {
          rhythmGain.gain.setValueAtTime(1.0, t); // Бір қалыпты
        } else if (currentRhythm === 'tolghau') {
          rhythmOsc.type = 'sine';
          rhythmOsc.frequency.setValueAtTime(1.2, t); // Баяу тыныс (1.2 Hz)
          rhythmGain.gain.setValueAtTime(0.7, t);
          rhythmOsc.connect(rhythmGain.gain);
          rhythmOsc.start(t);
        } else if (currentRhythm === 'dubir') {
          rhythmOsc.type = 'sawtooth';
          rhythmOsc.frequency.setValueAtTime(5.8, t); // Шабыс соққысы (5.8 Hz)
          rhythmGain.gain.setValueAtTime(0.5, t);
          rhythmOsc.connect(rhythmGain.gain);
          rhythmOsc.start(t);
        } else if (currentRhythm === 'aqqu') {
          rhythmOsc.type = 'triangle';
          rhythmOsc.frequency.setValueAtTime(3.2, t); // Желпініс (3.2 Hz)
          rhythmGain.gain.setValueAtTime(0.6, t);
          rhythmOsc.connect(rhythmGain.gain);
          rhythmOsc.start(t);
        }

        // Форманттар
        const skinF = this.ctx.createBiquadFilter();
        skinF.type = 'bandpass';
        skinF.frequency.setValueAtTime(290, t);
        skinF.Q.setValueAtTime(3.5, t);

        const woodF = this.ctx.createBiquadFilter();
        woodF.type = 'peaking';
        woodF.frequency.setValueAtTime(680, t);
        woodF.gain.setValueAtTime(6.5, t);
        woodF.Q.setValueAtTime(2.4, t);

        const dampF = this.ctx.createBiquadFilter();
        dampF.type = 'lowpass';
        dampF.frequency.setValueAtTime(2100, t);

        // Ысқыш қажалу шуылы
        const noise = this.ctx.createBufferSource();
        noise.buffer = bowNoiseBuffer;
        noise.loop = true;

        const noiseFilter = this.ctx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        noiseFilter.frequency.setValueAtTime(freq * 2.3, t);
        noiseFilter.Q.setValueAtTime(2.8, t);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.042, t);

        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noise.start(t);

        // Негізгі динамика
        const mainGain = this.ctx.createGain();
        mainGain.gain.setValueAtTime(0.001, t);
        mainGain.gain.exponentialRampToValueAtTime(isBass ? 0.36 : 0.42, t + 0.12);

        // Қосылу тізбегі
        o1.connect(skinF);
        o2.connect(skinF);
        skinF.connect(woodF);
        woodF.connect(dampF);
        
        dampF.connect(rhythmGain);
        noiseGain.connect(rhythmGain);
        rhythmGain.connect(mainGain);

        mainGain.connect(this.ctx.destination);

        o1.start(t);
        o2.start(t);

        this.voice = { o1, o2, lfo, lfoGain, noiseFilter, noise, mainGain, rhythmOsc };
      }

      setPitch(freq) {
        if (!this.voice) return;
        const t = this.ctx.currentTime;
        this.voice.o1.frequency.setTargetAtTime(freq, t, 0.045);
        this.voice.o2.frequency.setTargetAtTime(freq + 0.6, t, 0.045);
        this.voice.lfoGain.gain.setTargetAtTime(freq * 0.011, t, 0.045);
        this.voice.noiseFilter.frequency.setTargetAtTime(freq * 2.3, t, 0.045);
      }

      stop() {
        if (!this.voice) return;
        const t = this.ctx.currentTime;
        const v = this.voice;
        v.mainGain.gain.cancelScheduledValues(t);
        v.mainGain.gain.linearRampToValueAtTime(0.0001, t + 0.16);
        setTimeout(() => {
          try {
            v.o1.stop();
            v.o2.stop();
            v.lfo.stop();
            v.noise.stop();
            if (v.rhythmOsc) v.rhythmOsc.stop();
          } catch(e){}
        }, 200);
        this.voice = null;
      }
    }

    const bass = new RhythmicQobyzVoice(146.83);
    const treble = new RhythmicQobyzVoice(220.00);

    let isHold = false;
    function toggleHold() {
      initAudio();
      isHold = !isHold;
      const btn = document.getElementById('holdBtn');
      const laneL = document.getElementById('lane-l');
      const labelL = document.getElementById('label-l');

      if (isHold) {
        btn.classList.add('active');
        laneL.classList.add('active');
        bass.play(146.83, true);
        labelL.innerText = '147 Hz [Hold]';
      } else {
        btn.classList.remove('active');
        laneL.classList.remove('active');
        bass.stop();
        labelL.innerText = '—';
      }
    }

    const activeTouches = {};
    function calcFreq(y, h, baseFreq) {
      const p = Math.max(0, Math.min(1, y / h));
      return baseFreq * Math.pow(2, (p * 14) / 12);
    }

    const neck = document.getElementById('neck');

    neck.addEventListener('touchstart', (e) => {
      e.preventDefault();
      initAudio();
      const rect = neck.getBoundingClientRect();

      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const isLeft = (t.clientX - rect.left) < rect.width / 2;
        const side = isLeft ? 'l' : 'r';
        const inst = isLeft ? bass : treble;

        activeTouches[t.identifier] = { side, inst };

        const y = t.clientY - rect.top;
        const f = calcFreq(y, rect.height, inst.baseFreq);
        inst.play(f, isLeft);

        document.getElementById(`lane-${side}`).classList.add('active');
        document.getElementById(`ind-${side}`).style.top = y + 'px';
        document.getElementById(`label-${side}`).innerText = Math.round(f) + ' Hz';
      }
    }, { passive: false });

    neck.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = neck.getBoundingClientRect();

      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const item = activeTouches[t.identifier];
        if (item) {
          const y = Math.max(0, Math.min(rect.height, t.clientY - rect.top));
          const f = calcFreq(y, rect.height, item.inst.baseFreq);
          item.inst.setPitch(f);

          document.getElementById(`ind-${item.side}`).style.top = y + 'px';
          document.getElementById(`label-${item.side}`).innerText = Math.round(f) + ' Hz';
        }
      }
    }, { passive: false });

    function endTouches(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const item = activeTouches[t.identifier];
        if (item) {
          if (!(item.side === 'l' && isHold)) {
            item.inst.stop();
            document.getElementById(`lane-${item.side}`).classList.remove('active');
            document.getElementById(`label-${item.side}`).innerText = '—';
          }
          delete activeTouches[t.identifier];
        }
      }
    }
    neck.addEventListener('touchend', endTouches);
    neck.addEventListener('touchcancel', endTouches);

    // Mouse
    const laneR = document.getElementById('lane-r');
    let isMouseDown = false;

    laneR.addEventListener('mousedown', (e) => {
      e.preventDefault();
      initAudio();
      isMouseDown = true;
      laneR.classList.add('active');
      const rect = laneR.getBoundingClientRect();
      const y = e.clientY - rect.top;
      const f = calcFreq(y, rect.height, treble.baseFreq);
      treble.play(f, false);
      document.getElementById('ind-r').style.top = y + 'px';
      document.getElementById('label-r').innerText = Math.round(f) + ' Hz';
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const rect = laneR.getBoundingClientRect();
      const y = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
      const f = calcFreq(y, rect.height, treble.baseFreq);
      treble.setPitch(f);
      document.getElementById('ind-r').style.top = y + 'px';
      document.getElementById('label-r').innerText = Math.round(f) + ' Hz';
    });

    window.addEventListener('mouseup', () => {
      if (isMouseDown) {
        isMouseDown = false;
        laneR.classList.remove('active');
        treble.stop();
        document.getElementById('label-r').innerText = '—';
      }
    });
  </script>
</body>
</html>
