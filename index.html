<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qobyz.com — Vibrato qosylghan qobyz</title>
  <style>
    :root {
      --bg: #0c0a09;
      --panel: #171412;
      --accent: #d4a373;
      --glow: #ffc872;
      --wood: #2a1610;
      --skin: #d4ba9f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: #e6e2dd; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; }

    header { text-align: center; padding: 18px; z-index: 10; }
    h1 { color: var(--accent); letter-spacing: 2px; font-size: 1.6rem; margin-bottom: 6px; }
    p { color: #8c827a; font-size: 0.9rem; max-width: 480px; }

    .btn-api {
      margin-top: 12px;
      padding: 10px 22px;
      background: var(--accent);
      color: #0c0a09;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-api:hover { background: #faedcd; }

    /* Qobyz bejnesi */
    .qobyz-frame {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
      opacity: 0.35;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    .qobyz-frame.ready { opacity: 1; pointer-events: auto; }

    .qobyz-head { width: 50px; height: 70px; background: var(--wood); border-radius: 8px 8px 0 0; }
    
    .qobyz-neck {
      width: 44px;
      height: 360px;
      background: #190c07;
      position: relative;
      box-shadow: inset 0 0 10px #000;
    }

    .qobyz-body {
      width: 210px;
      height: 260px;
      background: #4a2717;
      border-radius: 40% 40% 45% 45%;
      margin-top: -24px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 20px;
      position: relative;
    }

    .qobyz-skin {
      width: 160px;
      height: 140px;
      background: radial-gradient(circle, var(--skin), #967554);
      border-radius: 10px 10px 45% 45%;
      position: relative;
    }

    .qobyz-bridge {
      width: 40px;
      height: 12px;
      background: #110805;
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 3px;
    }

    /* Qyldar */
    .string-lane {
      position: absolute;
      top: 0;
      height: 100%;
      width: 22px;
      cursor: ns-resize;
      display: flex;
      justify-content: center;
      touch-action: none;
    }
    .string-lane.left { left: 0; }
    .string-lane.right { right: 0; }

    .lane-string {
      width: 3px;
      height: 460px;
      background: #b8a698;
      position: absolute;
      top: -20px;
      pointer-events: none;
      transition: width 0.1s;
    }

    .string-lane.active .lane-string {
      background: #fff;
      box-shadow: 0 0 14px var(--glow);
      width: 4.5px;
    }

    .finger-point {
      width: 14px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      opacity: 0;
      box-shadow: 0 0 10px var(--glow);
    }
    .string-lane.active .finger-point { opacity: 1; }

    /* Vibrato parametrlerin retteu */
    .vibrato-controls {
      display: flex;
      gap: 20px;
      margin-top: 14px;
      font-size: 0.8rem;
      color: #8c827a;
    }

    .vibrato-controls label {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .vibrato-controls input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    #api-status { margin-top: 10px; font-size: 0.85rem; color: var(--glow); font-family: monospace; }
  </style>
</head>
<body>

  <header>
    <h1>QOBYZ API SYNTH</h1>
    <p>API arqyly dysty juikstep, qyl uistinen tuomen syrghytyyp ojnagnyz.</p>
    <button class="btn-api" id="apiBtn" onclick="initApiAudio()">API Dybysyn iske qosuu</button>
    
    <div class="vibrato-controls">
      <label>
        Vibrato terendigi (Diriul kuishi)
        <input type="range" id="vibDepth" min="0" max="0.08" step="0.005" value="0.025">
      </label>
      <label>
        Vibrato zhyldamdyghy (Hz)
        <input type="range" id="vibSpeed" min="2" max="8" step="0.2" value="4.8">
      </label>
    </div>
  </header>

  <div class="qobyz-frame" id="qobyzFrame">
    <div class="qobyz-head"></div>
    <div class="qobyz-neck">
      <!-- Sol ishek (Bas / Toghanaq) -->
      <div class="string-lane left" id="str-left">
        <div class="lane-string"></div>
        <div class="finger-point" id="pt-left"></div>
      </div>
      <!-- Ong ishek (Zhignishke / Kiltegne) -->
      <div class="string-lane right" id="str-right">
        <div class="lane-string"></div>
        <div class="finger-point" id="pt-right"></div>
      </div>
    </div>
    <div class="qobyz-body">
      <div class="qobyz-skin">
        <div class="qobyz-bridge"></div>
      </div>
    </div>
  </div>

  <div id="api-status">API kuiji: Qosuudy kuityp tur</div>

  <script>
    let audioCtx = null;
    const audioBuffers = { left: null, right: null };

    const AUDIO_API_ENDPOINTS = {
      left: 'https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/cello-mp3/D3.mp3',
      right: 'https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/cello-mp3/A3.mp3'
    };

    async function fetchAudioFromAPI(url) {
      const resp = await fetch(url);
      const arrayBuffer = await resp.arrayBuffer();
      return await audioCtx.decodeAudioData(arrayBuffer);
    }

    async function initApiAudio() {
      const btn = document.getElementById('apiBtn');
      const status = document.getElementById('api-status');
      
      btn.innerText = 'API-den dybys juikteluude...';
      status.innerText = 'Serverden uin uilgileri alynuda...';

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      try {
        const [bufLeft, bufRight] = await Promise.all([
          fetchAudioFromAPI(AUDIO_API_ENDPOINTS.left),
          fetchAudioFromAPI(AUDIO_API_ENDPOINTS.right)
        ]);

        audioBuffers.left = bufLeft;
        audioBuffers.right = bufRight;

        document.getElementById('qobyzFrame').classList.add('ready');
        btn.style.display = 'none';
        status.innerText = 'Dybys qosyldy! Qyldy basyp, syrghytygnyz.';
      } catch (err) {
        status.innerText = 'Qate oryn aldy: ' + err.message;
        btn.innerText = 'Qaita kuoiruu';
      }
    }

    const currentNotes = { left: null, right: null };

    function startNote(side, semitones) {
      if (!audioBuffers[side]) return;

      stopNote(side);

      const now = audioCtx.currentTime;

      // 1. Dybys buferi (Sэmpl)
      const src = audioCtx.createBufferSource();
      src.buffer = audioBuffers[side];
      src.loop = true;

      // Negizgi jyldamdyq (Pitch)
      const baseRate = Math.pow(2, semitones / 12);
      src.playbackRate.setValueAtTime(baseRate, now);

      // 2. VIBRATO (LFO moduliatsiia)
      const vibOsc = audioCtx.createOscillator();
      const vibGain = audioCtx.createGain();

      const speedVal = parseFloat(document.getElementById('vibSpeed').value) || 4.8;
      const depthVal = parseFloat(document.getElementById('vibDepth').value) || 0.025;

      vibOsc.type = 'sine';
      vibOsc.frequency.setValueAtTime(speedVal, now); // Diriul zhyldamdyghy
      vibGain.gain.setValueAtTime(depthVal * baseRate, now); // Diriul terendigi

      // Vibratony playbackRate parametrina qosamyz
      vibOsc.connect(vibGain);
      vibGain.connect(src.playbackRate);

      // 3. Formant filtr zhaine kulem
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(2200, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.7, now + 0.12);

      src.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      vibOsc.start(now);
      src.start(0);

      currentNotes[side] = { src, gain, vibOsc, vibGain, baseRate };
    }

    function slideNote(side, semitones) {
      if (currentNotes[side]) {
        const now = audioCtx.currentTime;
        const newRate = Math.pow(2, semitones / 12);
        currentNotes[side].baseRate = newRate;

        // Syrghu (glissando)
        currentNotes[side].src.playbackRate.setTargetAtTime(newRate, now, 0.04);

        // Vibrato terendigin zhagna notagha sajkestendiru
        const depthVal = parseFloat(document.getElementById('vibDepth').value) || 0.025;
        currentNotes[side].vibGain.gain.setTargetAtTime(depthVal * newRate, now, 0.04);
      }
    }

    function stopNote(side) {
      if (currentNotes[side]) {
        const now = audioCtx.currentTime;
        const note = currentNotes[side];

        note.gain.linearRampToValueAtTime(0, now + 0.15);
        note.src.stop(now + 0.2);
        note.vibOsc.stop(now + 0.2);

        currentNotes[side] = null;
      }
    }

    function bindTouchEvents(elementId, side) {
      const el = document.getElementById(elementId);
      const pt = document.getElementById(`pt-${side}`);
      let isDown = false;

      function getPos(e) {
        const rect = el.getBoundingClientRect();
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        let y = clientY - rect.top;
        return Math.max(0, Math.min(rect.height, y));
      }

      function onDown(e) {
        e.preventDefault();
        isDown = true;
        el.classList.add('active');
        const y = getPos(e);
        pt.style.top = y + 'px';
        
        const semitones = (y / el.clientHeight) * 14;
        startNote(side, semitones);
      }

      function onMove(e) {
        if (!isDown) return;
        e.preventDefault();
        const y = getPos(e);
        pt.style.top = y + 'px';
        
        const semitones = (y / el.clientHeight) * 14;
        slideNote(side, semitones);
      }

      function onUp(e) {
        if (isDown) {
          isDown = false;
          el.classList.remove('active');
          stopNote(side);
        }
      }

      el.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);

      el.addEventListener('touchstart', onDown, { passive: false });
      el.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onUp);
    }

    bindTouchEvents('str-left', 'left');
    bindTouchEvents('str-right', 'right');
  </script>
</body>
</html>
