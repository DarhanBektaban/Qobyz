<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QOBYZ.COM — Shynajy Saby Menyrghaghy</title>
  <style>
    :root {
      --bg: #070605;
      --panel: #140e0a;
      --border: #2e1d14;
      --accent: #d4a373;
      --glow: #ffb852;
      --rhythm: #4ef0a3;
      --drone: #70d6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: #e6e2dd; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; touch-action: none; }

    header { text-align: center; padding: 12px 10px 4px; z-index: 10; }
    h1 { color: var(--accent); letter-spacing: 2px; font-size: 1.35rem; text-transform: uppercase; margin-bottom: 2px; }
    p { color: #8c827a; font-size: 0.78rem; max-width: 520px; line-height: 1.35; }

    .deck {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .btn {
      padding: 6px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: #b5a497;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover { border-color: var(--accent); color: #fff; }
    .btn.active {
      background: var(--accent);
      color: #070605;
      font-weight: bold;
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(212, 163, 115, 0.4);
    }

    .btn-start {
      background: var(--accent);
      color: #070605;
      font-weight: bold;
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(212, 163, 115, 0.4);
    }
    .btn-start:hover { background: #faedcd; }

    /* Qobyz Korpusy */
    .qobyz-stage {
      position: relative;
      margin-top: 4px;
      width: 310px;
      height: 480px;
      opacity: 0.45;
      pointer-events: none;
      transition: opacity 0.3s;
      filter: drop-shadow(0 14px 30px rgba(0,0,0,0.9));
    }
    .qobyz-stage.ready { opacity: 1; pointer-events: auto; }

    svg.qobyz-svg { width: 100%; height: 100%; overflow: visible; position: absolute; top: 0; left: 0; }
    canvas#stringCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }

    /* Mojyn boiynsha tutas syrghu zonasy */
    #neck-slide-area {
      cursor: pointer;
      fill: transparent;
    }

    .touch-point { fill: #fff; filter: drop-shadow(0 0 8px var(--glow)); opacity: 0; pointer-events: none; }
    .touch-point.active { opacity: 1; }

    /* Ysqysh */
    #bow-group { cursor: grab; }
    #bow-group:active { cursor: grabbing; }
    .bow-stick { fill: #422617; stroke: #6e3d23; stroke-width: 1.5; }
    .bow-string { stroke: #faebd7; stroke-width: 3.5; stroke-linecap: round; }
    #bow-group.active .bow-string { stroke: #fff; filter: drop-shadow(0 0 8px var(--glow)); }

    /* Dashboard */
    .dashboard {
      margin-top: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 6px;
      display: flex;
      gap: 16px;
      font-size: 0.78rem;
      color: #998e84;
    }
    .dashboard span { font-family: monospace; font-weight: bold; }
    .val-rhythm { color: var(--rhythm); }
    .val-tempo { color: var(--glow); }
    .val-note { color: var(--accent); }
    .val-feedback { color: var(--drone); }
  </style>
</head>
<body>

  <header>
    <h1>QOBYZ.COM — Shynajy Syrghytu Modeli</h1>
    <p>Саусақты көтермей қыл бойымен жай сырғытыңыз — үн мен иірімдер бір-біріне үзіліссіз ұласып отырады.</p>

    <div class="deck">
      <button class="btn btn-start" id="startBtn" onclick="initEngine()">Қобызды ояту</button>
      <button class="btn" id="feedbackBtn" onclick="toggleFeedback(this)">Күңірен резонаторы: Қосулы</button>
      <button class="btn" id="doubleStringBtn" onclick="toggleDoubleString(this)">Қос қыл (Тоғанақ): Қосулы</button>
    </div>
  </header>

  <div class="qobyz-stage" id="stage">
    <canvas id="stringCanvas" width="310" height="480"></canvas>

    <svg class="qobyz-svg" viewBox="0 0 310 480">
      <defs>
        <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#120603"/>
          <stop offset="50%" stop-color="#3d1e10"/>
          <stop offset="100%" stop-color="#120603"/>
        </linearGradient>

        <radialGradient id="bodyCavity" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#0a0402"/>
          <stop offset="75%" stop-color="#241208"/>
          <stop offset="100%" stop-color="#3d1e10"/>
        </radialGradient>

        <radialGradient id="skinGrad" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#c9b095"/>
          <stop offset="80%" stop-color="#8a6e52"/>
          <stop offset="100%" stop-color="#543e2b"/>
        </radialGradient>
      </defs>

      <!-- 1. Basy zhaine quilaqtary -->
      <path d="M 140 12 C 140 4, 170 4, 170 12 L 167 46 L 143 46 Z" fill="url(#woodGrad)" stroke="#090302" stroke-width="1.5"/>
      <rect x="119" y="20" width="22" height="6" rx="2" fill="#0c0503"/>
      <circle cx="117" cy="23" r="5" fill="#241208"/>
      <rect x="169" y="32" width="22" height="6" rx="2" fill="#0c0503"/>
      <circle cx="193" cy="35" r="5" fill="#241208"/>

      <!-- 2. Mojyn -->
      <path d="M 143 46 L 139 220 L 171 220 L 167 46 Z" fill="url(#woodGrad)" stroke="#0c0503"/>

      <!-- 3. Shanaq zhaine terisi -->
      <path d="M 139 220 C 90 210, 65 270, 71 320 C 77 370, 97 450, 135 468 L 175 468 C 213 450, 233 370, 239 320 C 245 270, 220 210, 171 220 Z" fill="url(#woodGrad)" stroke="#090302" stroke-width="2"/>
      <path d="M 155 230 C 130 230, 93 250, 97 295 C 101 335, 135 350, 155 358 C 175 350, 209 335, 213 295 C 217 250, 180 230, 155 230 Z" fill="url(#bodyCavity)" stroke="#000" stroke-width="1.5"/>
      <path d="M 102 330 C 110 330, 135 348, 155 348 C 175 348, 200 330, 208 330 C 213 375, 197 435, 169 456 L 141 456 C 113 435, 97 375, 102 330 Z" fill="url(#skinGrad)" stroke="#3a2517" stroke-width="1.5"/>

      <!-- Tiek pen tuisin -->
      <path d="M 137 378 L 173 378 L 169 388 L 141 388 Z" fill="#080302" stroke="#000" rx="1"/>
      <rect x="147" y="458" width="16" height="14" rx="2" fill="#060201"/>

      <!-- Tiysu nukteleri (Korsetkishter) -->
      <ellipse id="dot-indicator" class="touch-point" cx="150" cy="100" rx="6" ry="3"/>

      <!-- TUTAS MOJYN AYMAGHY (SAUSAQTY KOTERMEJ ERKIN SYRGHYTU ZONE) -->
      <rect id="neck-slide-area" x="120" y="46" width="70" height="234"/>

      <!-- 4. Ysqysh -->
      <g id="bow-group" transform="translate(0, 310)">
        <path d="M 30 0 Q 155 -12 280 0 Q 155 -4 30 0 Z" class="bow-stick"/>
        <line x1="35" y1="3" x2="275" y2="3" class="bow-string"/>
        <rect x="255" y="-8" width="24" height="15" rx="3" fill="#140804" stroke="#543320"/>
      </g>
    </svg>
  </div>

  <div class="dashboard">
    <div>Ырғақ: <span id="rhythm-style" class="val-rhythm">Күтуде</span></div>
    <div>Екпін: <span id="rhythm-tempo" class="val-tempo">— BPM</span></div>
    <div>Нота: <span id="label-note" class="val-note">Тоғанақ (D3)</span></div>
    <div>Резонатор: <span id="label-feedback" class="val-feedback">Терең</span></div>
  </div>

  <script>
    let actx = null;
    let masterGain, filterBody, filterSkin;
    let oscStickSlip, noiseFriction, frictionGain;
    let droneOsc, droneGain;
    let delayNode, feedbackGain;
    let currentFreq = 146.83;
    let isBass = true;
    let isFeedbackEnabled = true;
    let isDoubleStringEnabled = true;

    function initEngine() {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        buildOptimalAcoustics();
        startCanvasAnimation();
      }
      if (actx.state === 'suspended') actx.resume();

      document.getElementById('stage').classList.add('ready');
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('rhythm-style').innerText = 'Еркін сарын';
    }

    function buildOptimalAcoustics() {
      const t = actx.currentTime;

      const harmonics = 28;
      const real = new Float32Array(harmonics);
      const imag = new Float32Array(harmonics);
      for (let n = 1; n < harmonics; n++) {
        imag[n] = (1 / Math.pow(n, 0.86)) * (n % 2 === 1 ? 1.25 : 0.7);
      }
      const wave = actx.createPeriodicWave(real, imag);

      oscStickSlip = actx.createOscillator();
      oscStickSlip.setPeriodicWave(wave);
      oscStickSlip.frequency.setValueAtTime(currentFreq, t);

      droneOsc = actx.createOscillator();
      droneOsc.setPeriodicWave(wave);
      droneOsc.frequency.setValueAtTime(146.83, t);

      const bSize = actx.sampleRate;
      const nBuf = actx.createBuffer(1, bSize, actx.sampleRate);
      const d = nBuf.getChannelData(0);
      for (let i = 0; i < bSize; i++) d[i] = (Math.random() * 2 - 1) * 0.35;

      noiseFriction = actx.createBufferSource();
      noiseFriction.buffer = nBuf;
      noiseFriction.loop = true;

      const nFilter = actx.createBiquadFilter();
      nFilter.type = 'bandpass';
      nFilter.frequency.setValueAtTime(2300, t);
      nFilter.Q.setValueAtTime(2.2, t);

      frictionGain = actx.createGain();
      frictionGain.gain.setValueAtTime(0, t);

      noiseFriction.connect(nFilter);
      nFilter.connect(frictionGain);
      noiseFriction.start(t);

      filterSkin = actx.createBiquadFilter();
      filterSkin.type = 'bandpass';
      filterSkin.frequency.setValueAtTime(318, t);
      filterSkin.Q.setValueAtTime(3.2, t);

      filterBody = actx.createBiquadFilter();
      filterBody.type = 'peaking';
      filterBody.frequency.setValueAtTime(560, t);
      filterBody.gain.setValueAtTime(7.5, t);
      filterBody.Q.setValueAtTime(2.0, t);

      delayNode = actx.createDelay();
      delayNode.delayTime.setValueAtTime(0.016, t);

      feedbackGain = actx.createGain();
      feedbackGain.gain.setValueAtTime(0.26, t);

      masterGain = actx.createGain();
      masterGain.gain.setValueAtTime(0, t);

      droneGain = actx.createGain();
      droneGain.gain.setValueAtTime(0.22, t);

      droneOsc.connect(droneGain);
      droneGain.connect(filterSkin);

      oscStickSlip.connect(filterSkin);
      filterSkin.connect(filterBody);

      filterBody.connect(delayNode);
      delayNode.connect(feedbackGain);
      feedbackGain.connect(filterSkin);

      filterBody.connect(masterGain);
      frictionGain.connect(masterGain);

      masterGain.connect(actx.destination);

      oscStickSlip.start(t);
      droneOsc.start(t);
    }

    function toggleFeedback(btn) {
      if (!feedbackGain) return;
      isFeedbackEnabled = !isFeedbackEnabled;
      const t = actx.currentTime;
      feedbackGain.gain.setTargetAtTime(isFeedbackEnabled ? 0.26 : 0.0, t, 0.05);
      btn.innerText = `Күңірен резонаторы: ${isFeedbackEnabled ? 'Қосулы' : 'Өшірулі'}`;
      document.getElementById('label-feedback').innerText = isFeedbackEnabled ? 'Терең' : 'Құрғақ';
      btn.classList.toggle('active', isFeedbackEnabled);
    }

    function toggleDoubleString(btn) {
      isDoubleStringEnabled = !isDoubleStringEnabled;
      if (droneGain) {
        droneGain.gain.setTargetAtTime(isDoubleStringEnabled ? 0.22 : 0.0, actx.currentTime, 0.05);
      }
      btn.innerText = `Қос қыл (Тоғанақ): ${isDoubleStringEnabled ? 'Қосулы' : 'Өшірулі'}`;
      btn.classList.toggle('active', isDoubleStringEnabled);
    }

    // Дыбысты бірден сырғыту (Glissando / Portamento)
    function setNote(freq, bassMode) {
      currentFreq = freq;
      isBass = bassMode;
      if (!actx || !oscStickSlip) return;
      // 0.04s аралығы саусақты жылжытқан сайын дыбыстың үзілмей, нағыз қобызша сырғуын береді
      oscStickSlip.frequency.setTargetAtTime(freq, actx.currentTime, 0.04);
    }

    /* =========================================================
       2. YRGHAQTY TANYP-BİLETİN QOZGHALTQYSH
       ========================================================= */

    let strokeTimes = [];
    let lastDirection = 0;
    let stringVibAmp = 0;

    function analyzeRhythm(dx, dt, velocity) {
      const now = performance.now();
      const currentDir = dx > 0 ? 1 : -1;

      if (lastDirection !== 0 && currentDir !== lastDirection && Math.abs(dx) > 3) {
        strokeTimes.push(now);
        if (strokeTimes.length > 5) strokeTimes.shift();

        if (strokeTimes.length >= 3) {
          let intervals = [];
          for (let i = 1; i < strokeTimes.length; i++) {
            intervals.push(strokeTimes[i] - strokeTimes[i - 1]);
          }
          let avgInterval = intervals.reduce((a, b) => a + b) / intervals.length;
          let bpm = Math.round(60000 / avgInterval);
          if (bpm >= 40 && bpm <= 260) {
            document.getElementById('rhythm-tempo').innerText = `${bpm} BPM`;
          }
        }

        const styleLabel = document.getElementById('rhythm-style');
        if (velocity > 36) {
          styleLabel.innerText = 'Дүбір (Жорға шабыс)';
          styleLabel.style.color = '#ff8e82';
        } else if (velocity > 17) {
          styleLabel.innerText = 'Екпінді сарын';
          styleLabel.style.color = '#ffb852';
        } else {
          styleLabel.innerText = 'Созылмалы толғау';
          styleLabel.style.color = '#4ef0a3';
        }
      }
      lastDirection = currentDir;
    }

    function applyAcousticPressure(velocity) {
      if (!actx || !masterGain) return;
      const t = actx.currentTime;
      const norm = Math.min(1.0, velocity / 30);

      if (norm > 0.03) {
        masterGain.gain.setTargetAtTime(0.22 + norm * 0.55, t, 0.03);
        frictionGain.gain.setTargetAtTime(norm * 0.05, t, 0.03);
        stringVibAmp = norm * 4.4;
      } else {
        masterGain.gain.setTargetAtTime(0.0001, t, 0.12);
        frictionGain.gain.setTargetAtTime(0, t, 0.12);
        stringVibAmp *= 0.85;
      }
    }

    /* =========================================================
       3. SOL QOL: SAUSAQTY KOTERMEJ ZHAJ ZHYLZHYTU (TUTAS MOJYN)
       ========================================================= */

    const neckArea = document.getElementById('neck-slide-area');
    const dotInd = document.getElementById('dot-indicator');
    let isFingerDown = false;
    let neckTouchId = null;

    function getCoords(e, touchId = null) {
      const svg = document.querySelector('.qobyz-svg');
      const pt = svg.createSVGPoint();

      if (e.touches) {
        let t = e.touches[0];
        if (touchId !== null) {
          for (let i = 0; i < e.touches.length; i++) {
            if (e.touches[i].identifier === touchId) {
              t = e.touches[i];
              break;
            }
          }
        }
        pt.x = t.clientX;
        pt.y = t.clientY;
      } else {
        pt.x = e.clientX;
        pt.y = e.clientY;
      }
      return pt.matrixTransform(svg.getScreenCTM().inverse());
    }

    function updateFingerPosition(svgP) {
      const y = Math.max(46, Math.min(270, svgP.y));
      const x = svgP.x;

      // X koordynatasy boiynsha ishekti anyqtau: 155-ten solgha — Toghanaq, onggha — Kiltegne
      const isLeft = x < 155;
      const baseF = isLeft ? 146.83 : 220.00;
      const sideName = isLeft ? 'Тоғанақ' : 'Кілтең';

      // Nүктені қылдың дәл үстіне бекітіп, тек бойымен жылжыту
      dotInd.setAttribute('cx', isLeft ? 150 : 160);
      dotInd.setAttribute('cy', y);

      // Y koordynatasy boiynsha notany eseptau (p: 0-den 1-ge deyin)
      const p = (y - 46) / (270 - 46);
      const f = baseF * Math.pow(2, (p * 14) / 12);

      // Sausaqty koterip-baspaj-aq notany birte-birte jylzhytyp otyru
      setNote(f, isLeft);
      document.getElementById('label-note').innerText = `${sideName} (${Math.round(f)} Hz)`;
    }

    function handleNeckStart(e) {
      e.preventDefault();
      initEngine();
      isFingerDown = true;
      dotInd.classList.add('active');

      if (e.touches) {
        neckTouchId = e.changedTouches[0].identifier;
      }

      const svgP = getCoords(e, neckTouchId);
      updateFingerPosition(svgP);
    }

    function handleNeckMove(e) {
      if (!isFingerDown) return;
      e.preventDefault();
      const svgP = getCoords(e, neckTouchId);
      updateFingerPosition(svgP);
    }

    function handleNeckEnd(e) {
      if (!isFingerDown) return;
      if (e.touches && neckTouchId !== null) {
        let stillTouching = false;
        for (let i = 0; i < e.touches.length; i++) {
          if (e.touches[i].identifier === neckTouchId) stillTouching = true;
        }
        if (stillTouching) return;
      }
      isFingerDown = false;
      neckTouchId = null;
      dotInd.classList.remove('active');
    }

    // Tintuuir oqighalary
    neckArea.addEventListener('mousedown', handleNeckStart);
    window.addEventListener('mousemove', (e) => { if (isFingerDown) handleNeckMove(e); });
    window.addEventListener('mouseup', handleNeckEnd);

    // Touch (Mobil'di ekran) oqighalary
    neckArea.addEventListener('touchstart', handleNeckStart, { passive: false });
    window.addEventListener('touchmove', (e) => { if (isFingerDown) handleNeckMove(e); }, { passive: false });
    window.addEventListener('touchend', handleNeckEnd);
    window.addEventListener('touchcancel', handleNeckEnd);

    /* =========================================================
       4. OÑ QOL: YSQYSH OQIGHALARY (BOW TRACKING)
       ========================================================= */

    const bowGroup = document.getElementById('bow-group');
    let isBowing = false;
    let bowTouchId = null;
    let lastX = 0;
    let lastTime = performance.now();
    let bowShiftX = 0;

    function onBowStart(e) {
      e.preventDefault();
      initEngine();
      isBowing = true;
      bowGroup.classList.add('active');

      if (e.touches) {
        bowTouchId = e.changedTouches[0].identifier;
        lastX = e.changedTouches[0].clientX;
      } else {
        lastX = e.clientX;
      }
      lastTime = performance.now();
    }

    function onBowMove(e) {
      if (!isBowing) return;
      let clientX = e.clientX;

      if (e.touches) {
        for (let i = 0; i < e.touches.length; i++) {
          if (e.touches[i].identifier === bowTouchId) {
            clientX = e.touches[i].clientX;
            break;
          }
        }
      }

      const now = performance.now();
      const dt = now - lastTime;

      if (dt > 11) {
        const dx = clientX - lastX;
        const velocity = (Math.abs(dx) / dt) * 35;

        bowShiftX = Math.max(-45, Math.min(45, bowShiftX + dx * 0.7));
        bowGroup.setAttribute('transform', `translate(${bowShiftX}, 310)`);

        applyAcousticPressure(velocity);
        analyzeRhythm(dx, dt, velocity);

        lastX = clientX;
        lastTime = now;
      }
    }

    function onBowEnd(e) {
      if (!isBowing) return;
      if (e.touches && bowTouchId !== null) {
        let stillTouching = false;
        for (let i = 0; i < e.touches.length; i++) {
          if (e.touches[i].identifier === bowTouchId) stillTouching = true;
        }
        if (stillTouching) return;
      }
      isBowing = false;
      bowTouchId = null;
      bowGroup.classList.remove('active');
      applyAcousticPressure(0);
      document.getElementById('rhythm-style').innerText = 'Күтуде';
    }

    bowGroup.addEventListener('mousedown', onBowStart);
    window.addEventListener('mousemove', onBowMove);
    window.addEventListener('mouseup', onBowEnd);

    bowGroup.addEventListener('touchstart', onBowStart, { passive: false });
    window.addEventListener('touchmove', onBowMove, { passive: false });
    window.addEventListener('touchend', onBowEnd);
    window.addEventListener('touchcancel', onBowEnd);

    setInterval(() => {
      if (isBowing) {
        if (performance.now() - lastTime > 70) applyAcousticPressure(0);
      }
    }, 40);

    /* =========================================================
       5. QYLDARDYGN CANVASKI TİRI TERBELIS ANIMATSIYASY
       ========================================================= */

    const cvs = document.getElementById('stringCanvas');
    const ctx = cvs.getContext('2d');
    let phase = 0;

    function startCanvasAnimation() {
      function draw() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        phase += 0.45;

        const leftVib = isBass ? Math.sin(phase) * stringVibAmp : 0;
        ctx.beginPath();
        ctx.moveTo(149, 24);
        ctx.quadraticCurveTo(149 + leftVib, 240, 151, 460);
        ctx.strokeStyle = isBass && stringVibAmp > 0.5 ? '#fff' : '#baa592';
        ctx.lineWidth = 3.8;
        ctx.stroke();

        const rightVib = !isBass ? Math.sin(phase * 1.3) * stringVibAmp : 0;
        ctx.beginPath();
        ctx.moveTo(161, 36);
        ctx.quadraticCurveTo(161 + rightVib, 240, 159, 460);
        ctx.strokeStyle = !isBass && stringVibAmp > 0.5 ? '#fff' : '#baa592';
        ctx.lineWidth = 2.4;
        ctx.stroke();

        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    }
  </script>
</body>
</html>
