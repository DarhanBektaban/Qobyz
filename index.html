<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QOBYZ.COM — Shynajy Qylqobyz Muzikalyq Quraly</title>
  <style>
    :root {
      --bg: #070605;
      --panel: #140f0c;
      --panel-border: #2c1e16;
      --accent: #d4a373;
      --glow: #ffb852;
      --wood-dark: #120703;
      --skin: #b3987d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: #e6e2dd; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; touch-action: none; }

    header { text-align: center; padding: 10px 10px 4px; z-index: 10; }
    h1 { color: var(--accent); letter-spacing: 3px; font-size: 1.35rem; text-transform: uppercase; margin-bottom: 2px; }
    p { color: #8c827a; font-size: 0.78rem; max-width: 520px; line-height: 1.35; }

    /* Retteu zhaine basqaru quraldary */
    .control-deck {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .btn {
      padding: 6px 14px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: #b5a497;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover { border-color: var(--accent); color: #fff; }
    .btn.active {
      background: var(--accent);
      color: #070605;
      font-weight: bold;
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(212, 163, 115, 0.4);
    }

    .btn-rec {
      background: #2b110d;
      border-color: #632219;
      color: #ff8e82;
    }
    .btn-rec.recording {
      background: #851c10;
      color: #fff;
      box-shadow: 0 0 12px #ff4d4d;
      animation: pulseRec 1.2s infinite;
    }
    @keyframes pulseRec { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    /* Qobyz Arenasy */
    .qobyz-stage {
      position: relative;
      margin-top: 4px;
      width: 320px;
      height: 480px;
      opacity: 0.45;
      pointer-events: none;
      transition: opacity 0.3s;
      filter: drop-shadow(0 14px 30px rgba(0,0,0,0.9));
    }
    .qobyz-stage.ready { opacity: 1; pointer-events: auto; }

    svg.qobyz-svg { width: 100%; height: 100%; overflow: visible; position: absolute; top: 0; left: 0; }
    canvas#stringCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }

    .string-touch { cursor: pointer; fill: transparent; }
    .touch-point { fill: #fff; filter: drop-shadow(0 0 8px var(--glow)); opacity: 0; pointer-events: none; }
    .touch-point.active { opacity: 1; }

    /* Ysqysh (Bow) */
    #bow-group { cursor: grab; }
    #bow-group:active { cursor: grabbing; }
    .bow-stick { fill: #422617; stroke: #6e3d23; stroke-width: 1.5; }
    .bow-string { stroke: #faebd7; stroke-width: 3.5; stroke-linecap: round; }
    #bow-group.active .bow-string { stroke: #fff; filter: drop-shadow(0 0 8px var(--glow)); }

    /* Qongyrau / Shyldyrmaqtar */
    .jingle-bell { fill: #c49a45; stroke: #5c4314; transition: transform 0.1s; transform-origin: center; }
    .jingle-ring.active .jingle-bell { transform: rotate(18deg); fill: #ffd978; filter: drop-shadow(0 0 6px #ffd978); }

    .readout { margin-top: 4px; font-size: 0.78rem; color: #998e84; display: flex; gap: 18px; }
    .readout span { color: var(--glow); font-family: monospace; }
  </style>
</head>
<body>

  <header>
    <h1>Dala Qobyzshysy</h1>
    <p>Кең дала жаңғырығы, бақсы қобызының шылдырмағы, тербелмелі қылдар мен сарынды жазып алу толықтырылған нағыз аспаптық модель.</p>

    <div class="control-deck">
      <button class="btn" id="startBtn" onclick="initAudio()">Қобызды ояту</button>
      <button class="btn" onclick="playMakam('qonur', this)">«Қоңыр»</button>
      <button class="btn" onclick="playMakam('aqqu', this)">«Аққу»</button>
      <button class="btn" onclick="playMakam('zhelmaya', this)">«Желмая»</button>
      <button class="btn active" onclick="stopMakam(this)">Еркін сарын</button>
      <button class="btn btn-rec" id="recBtn" onclick="toggleRecording()">● Сарынды жазу</button>
    </div>
  </header>

  <div class="qobyz-stage" id="stage">
    <!-- Tiri terbelis canvasy -->
    <canvas id="stringCanvas" width="320" height="480"></canvas>

    <svg class="qobyz-svg" viewBox="0 0 320 480">
      <defs>
        <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#120603"/>
          <stop offset="50%" stop-color="#3d1e10"/>
          <stop offset="100%" stop-color="#120603"/>
        </linearGradient>

        <radialGradient id="bodyCavity" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#0a0402"/>
          <stop offset="75%" stop-color="#241208"/>
          <stop offset="100%" stop-color="#3d1e10"/>
        </radialGradient>

        <radialGradient id="skinGrad" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#c9b095"/>
          <stop offset="80%" stop-color="#8a6e52"/>
          <stop offset="100%" stop-color="#543e2b"/>
        </radialGradient>
      </defs>

      <!-- 1. BASY, QUILAQ ZHÄNE SHYLDYRMAQ QOÑYRAULARY -->
      <path d="M 145 12 C 145 4, 175 4, 175 12 L 172 46 L 148 46 Z" fill="url(#woodGrad)" stroke="#090302" stroke-width="1.5"/>
      <rect x="124" y="20" width="22" height="6" rx="2" fill="#0c0503"/>
      <circle cx="122" cy="23" r="5" fill="#241208"/>
      <rect x="174" y="32" width="22" height="6" rx="2" fill="#0c0503"/>
      <circle cx="198" cy="35" r="5" fill="#241208"/>

      <!-- Shanaq basyndaghy baqsy shyldyrmaqtary -->
      <g id="jingles" class="jingle-ring">
        <circle cx="138" cy="18" r="4" class="jingle-bell"/>
        <circle cx="182" cy="18" r="4" class="jingle-bell"/>
        <circle cx="160" cy="8" r="4.5" class="jingle-bell"/>
      </g>

      <!-- 2. MOJYN (OYNAU AYMAGHY) -->
      <path d="M 148 46 L 144 220 L 176 220 L 172 46 Z" fill="url(#woodGrad)" stroke="#0c0503"/>

      <!-- 3. SHANAQ ZHÄNE TUIJE TERISI -->
      <path d="M 144 220 C 95 210, 70 270, 76 320 C 82 370, 102 450, 140 468 L 180 468 C 218 450, 238 370, 244 320 C 250 270, 225 210, 176 220 Z" fill="url(#woodGrad)" stroke="#090302" stroke-width="2"/>
      <path d="M 160 230 C 135 230, 98 250, 102 295 C 106 335, 140 350, 160 358 C 180 350, 214 335, 218 295 C 222 250, 185 230, 160 230 Z" fill="url(#bodyCavity)" stroke="#000" stroke-width="1.5"/>
      <path d="M 107 330 C 115 330, 140 348, 160 348 C 180 348, 205 330, 213 330 C 218 375, 202 435, 174 456 L 146 456 C 118 435, 102 375, 107 330 Z" fill="url(#skinGrad)" stroke="#3a2517" stroke-width="1.5"/>

      <!-- Tiek pen tuisin -->
      <path d="M 142 378 L 178 378 L 174 388 L 146 388 Z" fill="#080302" stroke="#000" rx="1"/>
      <rect x="152" y="458" width="16" height="14" rx="2" fill="#060201"/>

      <!-- Tiysu nukteleri -->
      <ellipse id="dot-l" class="touch-point" cx="155" cy="100" rx="6" ry="3"/>
      <ellipse id="dot-r" class="touch-point" cx="165" cy="100" rx="6" ry="3"/>

      <!-- Sol qolmen basatyn hitboxter -->
      <rect id="hit-l" class="string-touch" x="130" y="46" width="30" height="230"/>
      <rect id="hit-r" class="string-touch" x="160" y="46" width="30" height="230"/>

      <!-- 4. YSQYSH (BOW) -->
      <g id="bow-group" transform="translate(0, 310)">
        <path d="M 35 0 Q 160 -12 285 0 Q 160 -4 35 0 Z" class="bow-stick"/>
        <line x1="40" y1="3" x2="280" y2="3" class="bow-string"/>
        <rect x="260" y="-8" width="24" height="15" rx="3" fill="#140804" stroke="#543320"/>
      </g>
    </svg>
  </div>

  <div class="readout">
    <div>Сарын: <span id="label-note">Тоғанақ (D3)</span></div>
    <div>Ысқыш: <span id="label-bow">Тоқтап тұр</span></div>
    <div>Орны: <span id="label-pos">Қалыпты</span></div>
  </div>

  <script>
    let actx = null;
    let horsehairWave = null;
    let rosinNoise = null;
    let reverbNode = null;
    let makamTimer = null;

    // Jazyvaluu (Recorder)
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    function getAudioContext() {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        buildAcousticCore();
      }
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }

    // Algoritmik dalalyq reverberatsiia (Keng Dala Reverb)
    function buildAcousticCore() {
      // 1. 40 Garmonikalyq spektr
      const harmonics = 40;
      const real = new Float32Array(harmonics);
      const imag = new Float32Array(harmonics);
      real[0] = 0; imag[0] = 0;

      for (let n = 1; n < harmonics; n++) {
        let amp = 1 / Math.pow(n, 0.88);
        if (n === 1) amp = 1.0;
        if (n === 2) amp = 0.45;
        if (n >= 3 && n <= 5) amp *= 1.35;
        if (n % 2 !== 0) amp *= 1.2;
        imag[n] = amp;
      }
      horsehairWave = actx.createPeriodicWave(real, imag, { disableNormalization: false });

      // 2. Rosin friction shuyly
      const bSize = actx.sampleRate * 2;
      rosinNoise = actx.createBuffer(1, bSize, actx.sampleRate);
      const d = rosinNoise.getChannelData(0);
      for (let i = 0; i < bSize; i++) d[i] = (Math.random() * 2 - 1) * 0.4;

      // 3. Keng Dala Reverb Impulse
      const revLen = actx.sampleRate * 2.5;
      const revBuf = actx.createBuffer(2, revLen, actx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const cd = revBuf.getChannelData(ch);
        for (let i = 0; i < revLen; i++) {
          cd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / revLen, 3.0);
        }
      }
      reverbNode = actx.createConvolver();
      reverbNode.buffer = revBuf;

      const revGain = actx.createGain();
      revGain.gain.value = 0.28; // Dalalyq janghyryq molsheri
      reverbNode.connect(revGain);
      revGain.connect(actx.destination);
    }

    function initAudio() {
      getAudioContext();
      document.getElementById('stage').classList.add('ready');
      document.getElementById('startBtn').style.display = 'none';
      setupPhysicalQobyz();
      startStringAnimation();
    }

    let o1, o2, oSub, oDrone;
    let lfo, lfoGain, nSrc, nFilter, nGain, masterGain;
    let skinF, cavityF, warmF;
    let currentFreq = 146.83;
    let isBass = true;
    let destStreamNode = null;

    function setupPhysicalQobyz() {
      const t = actx.currentTime;

      o1 = actx.createOscillator();
      o2 = actx.createOscillator();
      oSub = actx.createOscillator();
      oDrone = actx.createOscillator();

      o1.setPeriodicWave(horsehairWave);
      o2.setPeriodicWave(horsehairWave);
      oDrone.setPeriodicWave(horsehairWave);
      oSub.type = 'triangle';

      o1.frequency.setValueAtTime(currentFreq, t);
      o2.frequency.setValueAtTime(currentFreq + 0.5, t);
      oSub.frequency.setValueAtTime(currentFreq * 0.5, t);
      oDrone.frequency.setValueAtTime(146.83, t);

      lfo = actx.createOscillator();
      lfoGain = actx.createGain();
      lfo.frequency.setValueAtTime(4.5, t);
      lfoGain.gain.setValueAtTime(currentFreq * 0.012, t);
      lfo.connect(o1.frequency);
      lfo.connect(o2.frequency);
      lfo.start(t);

      skinF = actx.createBiquadFilter();
      skinF.type = 'bandpass';
      skinF.frequency.setValueAtTime(315, t);
      skinF.Q.setValueAtTime(3.2, t);

      cavityF = actx.createBiquadFilter();
      cavityF.type = 'peaking';
      cavityF.frequency.setValueAtTime(540, t);
      cavityF.gain.setValueAtTime(8.5, t);
      cavityF.Q.setValueAtTime(2.0, t);

      warmF = actx.createBiquadFilter();
      warmF.type = 'lowpass';
      warmF.frequency.setValueAtTime(1850, t);

      nSrc = actx.createBufferSource();
      nSrc.buffer = rosinNoise;
      nSrc.loop = true;

      nFilter = actx.createBiquadFilter();
      nFilter.type = 'bandpass';
      nFilter.frequency.setValueAtTime(currentFreq * 2.4, t);
      nFilter.Q.setValueAtTime(2.5, t);

      nGain = actx.createGain();
      nGain.gain.setValueAtTime(0, t);

      nSrc.connect(nFilter);
      nFilter.connect(nGain);
      nSrc.start(t);

      masterGain = actx.createGain();
      masterGain.gain.setValueAtTime(0, t);

      const droneGain = actx.createGain();
      droneGain.gain.setValueAtTime(0.28, t);
      oDrone.connect(droneGain);
      droneGain.connect(skinF);

      o1.connect(skinF);
      o2.connect(skinF);
      skinF.connect(cavityF);
      cavityF.connect(warmF);

      const subGain = actx.createGain();
      subGain.gain.setValueAtTime(0.28, t);
      oSub.connect(subGain);
      subGain.connect(warmF);

      warmF.connect(masterGain);
      nGain.connect(masterGain);

      // Reverb zhaine tikeliye shygys
      masterGain.connect(actx.destination);
      masterGain.connect(reverbNode);

      // Diktofon uishin MediaStreamDestination
      destStreamNode = actx.createMediaStreamDestination();
      masterGain.connect(destStreamNode);

      o1.start(t);
      o2.start(t);
      oSub.start(t);
      oDrone.start(t);
    }

    // Shyldyrmaq qoñyrauyn shylanghytatu (Jingle Bell Trigger)
    function ringJingles() {
      if (!actx) return;
      const t = actx.currentTime;
      const bellOsc = actx.createOscillator();
      const bellGain = actx.createGain();
      const bellFilter = actx.createBiquadFilter();

      bellOsc.type = 'sine';
      bellOsc.frequency.setValueAtTime(3200 + Math.random() * 800, t);

      bellFilter.type = 'highpass';
      bellFilter.frequency.setValueAtTime(2800, t);

      bellGain.gain.setValueAtTime(0.045, t);
      bellGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);

      bellOsc.connect(bellFilter);
      bellFilter.connect(bellGain);
      bellGain.connect(actx.destination);
      if (reverbNode) bellGain.connect(reverbNode);

      bellOsc.start(t);
      bellOsc.stop(t + 0.4);

      const jEl = document.getElementById('jingles');
      jEl.classList.add('active');
      setTimeout(() => jEl.classList.remove('active'), 120);
    }

    // Ysqyshtyn vertikal ornyna bajlanysty tembrdi uozgertu (Sul Ponticello / Sul Tasto)
    function applyBowVerticalPosition(bowY) {
      if (!actx || !warmF) return;
      const t = actx.currentTime;
      // Tiekke jaqyn (Y=350-380) nemese mojyngha jaqyn (Y=260-290)
      if (bowY > 340) {
        // Sul Ponticello: Otzkir oberton, zhogharghy filtr ashylady
        warmF.frequency.setTargetAtTime(2800, t, 0.08);
        document.getElementById('label-pos').innerText = 'Тиекте (Өткір)';
      } else if (bowY < 290) {
        // Sul Tasto: Zhumsaq, qongyr, barqyt uin
        warmF.frequency.setTargetAtTime(1400, t, 0.08);
        document.getElementById('label-pos').innerText = 'Мойында (Қоңыр)';
      } else {
        warmF.frequency.setTargetAtTime(1850, t, 0.08);
        document.getElementById('label-pos').innerText = 'Қалыпты';
      }
    }

    function setNotePitch(freq, bassMode) {
      currentFreq = freq;
      isBass = bassMode;
      if (!actx || !o1) return;
      const t = actx.currentTime;
      o1.frequency.setTargetAtTime(freq, t, 0.05);
      o2.frequency.setTargetAtTime(freq + (isBass ? 0.42 : 0.65), t, 0.05);
      oSub.frequency.setTargetAtTime(freq * 0.5, t, 0.05);
      lfoGain.gain.setTargetAtTime(freq * 0.012, t, 0.05);
      nFilter.frequency.setTargetAtTime(freq * 2.4, t, 0.05);
    }

    let stringVibrationAmp = 0;

    function applyBowMotion(velocity) {
      if (!actx || !masterGain) return;
      const t = actx.currentTime;
      const norm = Math.min(1.0, velocity / 30);

      if (norm > 0.03) {
        const vol = 0.2 + (norm * 0.55);
        masterGain.gain.setTargetAtTime(vol, t, 0.04);
        nGain.gain.setTargetAtTime(norm * 0.05, t, 0.04);
        stringVibrationAmp = norm * 4.5;
        document.getElementById('label-bow').innerText = `Қобыздалуда (${Math.round(norm * 100)}%)`;

        // Qatty ysqysh siltenisi kezinde shyldyrmaq synghyry
        if (norm > 0.68 && Math.random() < 0.3) {
          ringJingles();
        }
      } else {
        masterGain.gain.setTargetAtTime(0.0001, t, 0.12);
        nGain.gain.setTargetAtTime(0, t, 0.12);
        stringVibrationAmp *= 0.85;
        document.getElementById('label-bow').innerText = 'Тоқтап тұр';
      }
    }

    // 1. SOL QOL
    const hitL = document.getElementById('hit-l');
    const hitR = document.getElementById('hit-r');
    const dotL = document.getElementById('dot-l');
    const dotR = document.getElementById('dot-r');

    function bindNeck(hitElem, dotElem, baseF, bassMode, sideName) {
      let active = false;
      function getSvgY(e) {
        const svg = document.querySelector('.qobyz-svg');
        const pt = svg.createSVGPoint();
        pt.x = e.touches ? e.touches[0].clientX : e.clientX;
        pt.y = e.touches ? e.touches[0].clientY : e.clientY;
        const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
        return Math.max(46, Math.min(270, svgP.y));
      }

      function onDown(e) {
        e.preventDefault();
        initAudio();
        active = true;
        dotElem.classList.add('active');
        const y = getSvgY(e);
        dotElem.setAttribute('cy', y);
        const p = (y - 46) / (270 - 46);
        const f = baseF * Math.pow(2, (p * 14) / 12);
        setNotePitch(f, bassMode);
        document.getElementById('label-note').innerText = `${sideName} (${Math.round(f)} Hz)`;
      }

      function onMove(e) {
        if (!active) return;
        e.preventDefault();
        const y = getSvgY(e);
        dotElem.setAttribute('cy', y);
        const p = (y - 46) / (270 - 46);
        const f = baseF * Math.pow(2, (p * 14) / 12);
        setNotePitch(f, bassMode);
        document.getElementById('label-note').innerText = `${sideName} (${Math.round(f)} Hz)`;
      }

      function onUp() {
        if (active) {
          active = false;
          dotElem.classList.remove('active');
        }
      }

      hitElem.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', (e) => { if(active) onMove(e); });
      window.addEventListener('mouseup', onUp);

      hitElem.addEventListener('touchstart', onDown, {passive: false});
      window.addEventListener('touchmove', (e) => { if(active) onMove(e); }, {passive: false});
      window.addEventListener('touchend', onUp);
    }

    bindNeck(hitL, dotL, 146.83, true, 'Тоғанақ');
    bindNeck(hitR, dotR, 220.00, false, 'Кілтең');

    // 2. ONG QOL (YSQYSH - EKİ OISTI QOZGHALYS)
    const bowGroup = document.getElementById('bow-group');
    let isBowing = false;
    let lastX = 0;
    let lastY = 310;
    let lastTime = performance.now();
    let bowShiftX = 0;
    let bowShiftY = 310;

    function onBowStart(e) {
      e.preventDefault();
      initAudio();
      isBowing = true;
      bowGroup.classList.add('active');
      lastX = e.touches ? e.touches[0].clientX : e.clientX;
      lastY = e.touches ? e.touches[0].clientY : e.clientY;
      lastTime = performance.now();
    }

    function onBowMove(e) {
      if (!isBowing) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const now = performance.now();
      const dt = now - lastTime;

      if (dt > 12) {
        const dx = clientX - lastX;
        const dy = clientY - lastY;
        const velocity = (Math.abs(dx) / dt) * 35;

        bowShiftX = Math.max(-45, Math.min(45, bowShiftX + dx * 0.7));
        bowShiftY = Math.max(260, Math.min(370, bowShiftY + dy * 0.5));

        bowGroup.setAttribute('transform', `translate(${bowShiftX}, ${bowShiftY})`);

        applyBowMotion(velocity);
        applyBowVerticalPosition(bowShiftY);

        lastX = clientX;
        lastY = clientY;
        lastTime = now;
      }
    }

    function onBowEnd() {
      if (isBowing) {
        isBowing = false;
        bowGroup.classList.remove('active');
        applyBowMotion(0);
      }
    }

    bowGroup.addEventListener('mousedown', onBowStart);
    window.addEventListener('mousemove', onBowMove);
    window.addEventListener('mouseup', onBowEnd);

    bowGroup.addEventListener('touchstart', onBowStart, {passive: false});
    window.addEventListener('touchmove', onBowMove, {passive: false});
    window.addEventListener('touchend', onBowEnd);

    setInterval(() => {
      if (isBowing) {
        if (performance.now() - lastTime > 75) applyBowMotion(0);
      }
    }, 40);

    // 3. QYLDARDYGN TİRI TERBELIS ANIMATSIYASY (CANVAS PHYSICS)
    const cvs = document.getElementById('stringCanvas');
    const ctx = cvs.getContext('2d');
    let phase = 0;

    function startStringAnimation() {
      function drawStrings() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        phase += 0.45;

        // Sol qyl (Toghanaq) terbelisi
        const leftVib = isBass ? Math.sin(phase) * stringVibrationAmp : 0;
        ctx.beginPath();
        ctx.moveTo(154, 24);
        ctx.quadraticCurveTo(154 + leftVib, 240, 156, 460);
        ctx.strokeStyle = isBass && stringVibrationAmp > 0.5 ? '#fff' : '#baa592';
        ctx.lineWidth = 3.8;
        ctx.stroke();

        // Ong qyl (Kiltegne) terbelisi
        const rightVib = !isBass ? Math.sin(phase * 1.3) * stringVibrationAmp : 0;
        ctx.beginPath();
        ctx.moveTo(166, 36);
        ctx.quadraticCurveTo(166 + rightVib, 240, 164, 460);
        ctx.strokeStyle = !isBass && stringVibrationAmp > 0.5 ? '#fff' : '#baa592';
        ctx.lineWidth = 2.4;
        ctx.stroke();

        requestAnimationFrame(drawStrings);
      }
      requestAnimationFrame(drawStrings);
    }

    // 4. KÜIJ MAQAMDARY
    function stopMakam(btn) {
      if (makamTimer) clearTimeout(makamTimer);
      document.querySelectorAll('.control-deck .btn').forEach(b => {
        if (b.id !== 'recBtn') b.classList.remove('active');
      });
      if (btn) btn.classList.add('active');
      applyBowMotion(0);
      dotR.classList.remove('active');
      document.getElementById('label-note').innerText = 'Еркін сарын';
    }

    function playMakam(type, btn) {
      initAudio();
      stopMakam();
      btn.classList.add('active');
      dotR.classList.add('active');

      const makams = {
        qonur: [
          { y: 60, f: 220.0, v: 22, t: 800 },
          { y: 95, f: 246.9, v: 18, t: 700 },
          { y: 120, f: 261.6, v: 24, t: 900 },
          { y: 95, f: 246.9, v: 16, t: 600 },
          { y: 60, f: 220.0, v: 26, t: 1200 }
        ],
        aqqu: [
          { y: 120, f: 261.6, v: 20, t: 400 },
          { y: 160, f: 293.6, v: 26, t: 500 },
          { y: 200, f: 329.6, v: 30, t: 700 },
          { y: 160, f: 293.6, v: 22, t: 450 },
          { y: 120, f: 261.6, v: 18, t: 600 }
        ],
        zhelmaya: [
          { y: 70, f: 220.0, v: 32, t: 300 },
          { y: 110, f: 246.9, v: 36, t: 300 },
          { y: 140, f: 277.1, v: 40, t: 350 },
          { y: 110, f: 246.9, v: 34, t: 300 }
        ]
      };

      const sequence = makams[type];
      let step = 0;
      let bowDir = 1;

      function playStep() {
        const item = sequence[step];
        dotR.setAttribute('cy', item.y);
        setNotePitch(item.f, false);
        document.getElementById('label-note').innerText = `${Math.round(item.f)} Hz (Күй)`;

        bowDir *= -1;
        bowGroup.setAttribute('transform', `translate(${bowDir * 28}, 310)`);
        applyBowMotion(item.v);

        step = (step + 1) % sequence.length;
        makamTimer = setTimeout(playStep, item.t);
      }
      playStep();
    }

    // 5. AUDIONY JAZU ZHÄNE SAQTAU (AUDIO RECORDER)
    function toggleRecording() {
      initAudio();
      const recBtn = document.getElementById('recBtn');

      if (!isRecording) {
        // Bastau
        recordedChunks = [];
        const stream = destStreamNode.stream;
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'audio/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          a.download = `qobyz_saryny_${Date.now()}.webm`;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
          }, 100);
        };

        mediaRecorder.start();
        isRecording = true;
        recBtn.classList.add('recording');
        recBtn.innerText = '■ Жазуды тоқтату';
      } else {
        // Toqtatu zhaine saqtau
        mediaRecorder.stop();
        isRecording = false;
        recBtn.classList.remove('recording');
        recBtn.innerText = '● Сарынды жазу';
      }
    }
  </script>
