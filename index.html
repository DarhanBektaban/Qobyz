<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Шынайы Қылқобыз Симуляторы</title>
  <style>
    :root {
      --bg: #120e0c;
      --text: #e6e2dd;
      --wood-dark: #2a1610;
      --wood-light: #5d3a29;
      --skin: #d4ba9f;
      --string: #c4b5a9;
      --string-glow: #ffc872;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: system-ui, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none; /* Мобильді құрылғыда экран сырғып кетпеуі үшін */
    }

    header {
      text-align: center;
      padding: 20px;
      z-index: 10;
    }

    h1 {
      font-size: 1.8rem;
      color: #d4a373;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    p {
      color: #8c827a;
      font-size: 0.95rem;
      max-width: 500px;
      margin: 0 auto 20px;
      line-height: 1.5;
    }

    .start-btn {
      background: #d4a373;
      color: #120e0c;
      border: none;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 163, 115, 0.3);
      transition: 0.2s;
    }

    .start-btn:hover {
      background: #faedcd;
      transform: translateY(-2px);
    }

    /* ҚОБЫЗДЫҢ БЕЙНЕСІ */
    .qobyz-container {
      position: relative;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
      opacity: 0.5;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    .qobyz-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Қобыз басы / құлақтары */
    .qobyz-head {
      width: 60px;
      height: 80px;
      background: linear-gradient(to right, #1a0d09, var(--wood-dark), #1a0d09);
      border-radius: 10px 10px 0 0;
      position: relative;
    }

    .tuning-peg {
      width: 15px;
      height: 10px;
      background: #110805;
      position: absolute;
      top: 30px;
      border-radius: 2px;
    }
    .peg-left { left: -10px; }
    .peg-right { right: -10px; top: 50px; }

    /* Қобыз мойны (ойнайтын аймақ) */
    .qobyz-neck {
      width: 45px;
      height: 350px; /* Ойнайтын ұзындық */
      background: linear-gradient(to right, #22110c, var(--wood-dark), #22110c);
      position: relative;
      z-index: 2;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    /* Қобыз шанағы */
    .qobyz-body {
      width: 220px;
      height: 280px;
      background: radial-gradient(circle at center, var(--wood-light), #1a0d09);
      border-radius: 40% 40% 45% 45%;
      margin-top: -30px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 20px;
      border: 2px solid #1a0d09;
    }

    /* Түйе терісі (жарғақ) */
    .qobyz-skin {
      width: 170px;
      height: 150px;
      background: radial-gradient(circle at center, var(--skin), #a88a6b);
      border-radius: 10px 10px 45% 45%;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
    }

    /* Тиек (Bridge) */
    .qobyz-bridge {
      width: 40px;
      height: 12px;
      background: #110805;
      position: absolute;
      top: 30px;
      border-radius: 4px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.5);
    }

    /* ҚЫЛДАР (Интерактивті аймақтар) */
    .string-hitbox {
      position: absolute;
      top: 0;
      height: 100%;
      width: 22px;
      cursor: ns-resize; /* Жоғары-төмен курсор */
      display: flex;
      justify-content: center;
      touch-action: none;
    }
    
    .string-hitbox.left { left: 0; }
    .string-hitbox.right { right: 0; }

    /* Көрінетін қыл */
    .string-visual {
      width: 3px;
      height: 460px; /* Басынан тиекке дейін */
      background: var(--string);
      position: absolute;
      top: -20px;
      box-shadow: 0 0 3px rgba(0,0,0,0.8);
      transition: background 0.1s;
      z-index: 5;
      pointer-events: none;
    }

    .string-hitbox.active .string-visual {
      background: #fff;
      box-shadow: 0 0 15px var(--string-glow), 0 0 5px var(--string-glow);
      width: 4px;
    }

    /* Саусақтың орнын көрсететін жарқыл (Finger position indicator) */
    .finger-indicator {
      width: 14px;
      height: 8px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      box-shadow: 0 0 10px var(--string-glow);
      opacity: 0;
      transition: opacity 0.1s;
    }

    .string-hitbox.active .finger-indicator {
      opacity: 1;
    }

    .status {
      margin-top: 20px;
      font-size: 1.2rem;
      color: var(--string-glow);
      font-family: monospace;
      height: 30px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Қылқобыз</h1>
    <p>«Бастау» батырмасын басыңыз. Содан соң қылдың бойымен (мойын тұсынан) басып тұрып, жоғары-төмен сырғытып ойнаңыз.</p>
    <button class="start-btn" id="startBtn">Бастау / Дыбысты қосу</button>
  </header>

  <!-- ҚОБЫЗ БЕЙНЕСІ -->
  <div class="qobyz-container" id="qobyz">
    <div class="qobyz-head">
      <div class="tuning-peg peg-left"></div>
      <div class="tuning-peg peg-right"></div>
    </div>
    
    <div class="qobyz-neck" id="neck">
      <!-- Сол жақ қыл (Жуан, D3) -->
      <div class="string-hitbox left" id="str-left">
        <div class="string-visual"></div>
        <div class="finger-indicator" id="finger-left"></div>
      </div>
      
      <!-- Оң жақ қыл (Жіңішке, A3) -->
      <div class="string-hitbox right" id="str-right">
        <div class="string-visual"></div>
        <div class="finger-indicator" id="finger-right"></div>
      </div>
    </div>

    <div class="qobyz-body">
      <div class="qobyz-skin">
        <div class="qobyz-bridge"></div>
      </div>
    </div>
  </div>

  <div class="status" id="statusText"></div>

  <script>
    let audioCtx = null;
    let isPlaying = false;
    
    // Синтезатор инстанстары (екі қылға бөлек)
    const voices = {
      left: { active: false, voice: null, baseFreq: 146.83, maxSemitones: 14 }, // D3-тен жоғары
      right: { active: false, voice: null, baseFreq: 220.00, maxSemitones: 14 } // A3-тен жоғары
    };

    const startBtn = document.getElementById('startBtn');
    const qobyzContainer = document.getElementById('qobyz');
    const statusText = document.getElementById('statusText');

    startBtn.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      qobyzContainer.classList.add('active');
      startBtn.style.display = 'none';
      statusText.textContent = 'Қылды сырғытып ойнаңыз...';
    });

    // Қобыз үнінің синтезаторы (алдыңғы физикалық моделдеу)
    function createQobyzVoice(ctx, initialFreq) {
      const now = ctx.currentTime;
      
      const masterGain = ctx.createGain();
      masterGain.gain.setValueAtTime(0, now);
      masterGain.gain.linearRampToValueAtTime(0.35, now + 0.1); // Жұмсақ басталу (Attack)

      // Негізгі қыл генераторлары
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      osc1.type = 'sawtooth';
      osc2.type = 'sawtooth';
      
      osc1.frequency.setValueAtTime(initialFreq, now);
      osc2.frequency.setValueAtTime(initialFreq, now);
      osc2.detune.setValueAtTime(8, now); // Хор эффектісі (бірнеше қыл)

      // Вибрато (LFO)
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      lfo.frequency.setValueAtTime(5, now);
      lfoGain.gain.setValueAtTime(3, now);
      lfo.connect(osc1.frequency);
      lfo.connect(osc2.frequency);

      // Шанақ фильтрі (Formant)
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(600, now);
      filter.Q.setValueAtTime(2.5, now);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(masterGain);
      masterGain.connect(ctx.destination);

      lfo.start(now);
      osc1.start(now);
      osc2.start(now);

      return {
        setFrequency: (freq) => {
          // Дыбыстың сырғуы (Портаменто/Глиссандо) үшін setTargetAtTime қолданамыз
          osc1.frequency.setTargetAtTime(freq, ctx.currentTime, 0.05);
          osc2.frequency.setTargetAtTime(freq, ctx.currentTime, 0.05);
        },
        stop: () => {
          const stopTime = ctx.currentTime;
          masterGain.gain.cancelScheduledValues(stopTime);
          masterGain.gain.setValueAtTime(masterGain.gain.value, stopTime);
          masterGain.gain.linearRampToValueAtTime(0, stopTime + 0.15); // Жұмсақ сөну (Release)
          
          setTimeout(() => {
            osc1.stop();
            osc2.stop();
            lfo.stop();
          }, 200);
        }
      };
    }

    // Тышқан/Саусақ орнын жиілікке (pitch) айналдыру
    function calculateFrequency(yPos, rectHeight, baseFreq, maxSemitones) {
      // yPos 0 болғанда (ең үсті) -> baseFreq (ашық ішек)
      // yPos rectHeight болғанда (ең асты) -> ең жоғарғы нота
      // Шынайы аспапта пернелер логарифмдік қысқарады, бірақ визуалды оңай болу үшін сызықтық пайыз аламыз
      let percent = Math.max(0, Math.min(1, yPos / rectHeight));
      
      // Жиілік формуласы: f = f0 * 2^(n/12), мұндағы n - жартытондар саны
      let semitones = percent * maxSemitones; 
      return baseFreq * Math.pow(2, semitones / 12);
    }

    function getNoteName(freq) {
      const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      const c0 = 16.35;
      const halfStepsBelowMiddleC = Math.round(12 * Math.log2(freq / c0));
      const octave = Math.floor(halfStepsBelowMiddleC / 12);
      const note = notes[halfStepsBelowMiddleC % 12];
      return `${note}${octave}`;
    }

    // Әр қылға интерактивтілікті қосу
    function setupString(stringId, side) {
      const element = document.getElementById(stringId);
      const indicator = document.getElementById(`finger-${side}`);
      const voiceData = voices[side];

      function startPlay(event) {
        if (!audioCtx) return;
        event.preventDefault(); // Экран сырғымау үшін
        element.classList.add('active');
        voiceData.active = true;
        
        let yPos = getClientY(event) - element.getBoundingClientRect().top;
        let freq = calculateFrequency(yPos, element.clientHeight, voiceData.baseFreq, voiceData.maxSemitones);
        
        indicator.style.top = `${yPos}px`;
        statusText.textContent = `Нота: ${getNoteName(freq)} (${Math.round(freq)} Hz)`;

        if (voiceData.voice) voiceData.voice.stop();
        voiceData.voice = createQobyzVoice(audioCtx, freq);
      }

      function movePlay(event) {
        if (!voiceData.active || !voiceData.voice) return;
        event.preventDefault();
        
        let rect = element.getBoundingClientRect();
        let yPos = getClientY(event) - rect.top;
        
        // Шектен шықпау
        yPos = Math.max(0, Math.min(rect.height, yPos));
        
        let freq = calculateFrequency(yPos, rect.height, voiceData.baseFreq, voiceData.maxSemitones);
        
        indicator.style.top = `${yPos}px`;
        statusText.textContent = `Нота: ${getNoteName(freq)} (${Math.round(freq)} Hz)`;
        
        // Синтезатор жиілігін үздіксіз жаңарту (Глиссандо)
        voiceData.voice.setFrequency(freq);
      }

      function stopPlay(event) {
        if (event) event.preventDefault();
        if (voiceData.active) {
          element.classList.remove('active');
          voiceData.active = false;
          if (voiceData.voice) {
             voiceData.voice.stop();
             voiceData.voice = null;
          }
          statusText.textContent = 'Қылды сырғытып ойнаңыз...';
        }
      }

      function getClientY(e) {
        return e.touches ? e.touches[0].clientY : e.clientY;
      }

      // Тінтуір (Mouse) оқиғалары
      element.addEventListener('mousedown', startPlay);
      window.addEventListener('mousemove', (e) => { if (voiceData.active) movePlay(e); });
      window.addEventListener('mouseup', stopPlay);

      // Сенсорлы экран (Touch) оқиғалары
      element.addEventListener('touchstart', startPlay, {passive: false});
      element.addEventListener('touchmove', movePlay, {passive: false});
      element.addEventListener('touchend', stopPlay);
      element.addEventListener('touchcancel', stopPlay);
    }

    // Екі қылды іске қосу
    setupString('str-left', 'left');
    setupString('str-right', 'right');

  </script>
</body>
</html>
