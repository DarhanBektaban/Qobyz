<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qobyz.com — Tolyq Qobyzdauy</title>
  <style>
    :root {
      --bg: #0b0908;
      --panel: #161210;
      --accent: #d4a373;
      --glow: #ffb852;
      --wood-dark: #221008;
      --wood-mid: #3d1e10;
      --skin: #b89c7d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: #e6e2dd; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; touch-action: none; }

    header { text-align: center; padding: 14px 10px 4px; z-index: 10; }
    h1 { color: var(--accent); letter-spacing: 2px; font-size: 1.45rem; text-transform: uppercase; margin-bottom: 2px; }
    p { color: #8c827a; font-size: 0.82rem; max-width: 500px; line-height: 1.4; }

    .btn { padding: 8px 20px; background: var(--accent); color: #0b0908; font-weight: 600; font-size: 0.82rem; border: none; border-radius: 4px; cursor: pointer; margin-top: 8px; }
    .btn:hover { background: #faedcd; }

    /* Qobyz Korpusy (Yqsham SVG) */
    .qobyz-stage {
      position: relative;
      margin-top: 8px;
      width: 290px;
      height: 480px;
      opacity: 0.4;
      pointer-events: none;
      transition: opacity 0.3s;
      filter: drop-shadow(0 14px 28px rgba(0,0,0,0.85));
    }
    .qobyz-stage.ready { opacity: 1; pointer-events: auto; }

    svg.qobyz-svg { width: 100%; height: 100%; overflow: visible; }

    .string-touch { cursor: pointer; fill: transparent; }
    .string-visual { stroke: #baa592; stroke-width: 2.2; pointer-events: none; }
    .string-visual.bass { stroke-width: 3.6; }

    .string-visual.active {
      stroke: #fff;
      filter: drop-shadow(0 0 8px var(--glow));
    }

    .touch-point { fill: #fff; filter: drop-shadow(0 0 8px var(--glow)); opacity: 0; pointer-events: none; }
    .touch-point.active { opacity: 1; }

    /* YSQYSH (BOW) - Qobyzdygn uistindegi qozghalys */
    #bow-group {
      cursor: ew-resize;
    }
    .bow-stick {
      fill: #422617;
      stroke: #693c24;
      stroke-width: 1.5;
    }
    .bow-string {
      stroke: #faebd7;
      stroke-width: 3.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 2px rgba(0,0,0,0.8));
    }
    #bow-group.active .bow-string {
      stroke: #fff;
      filter: drop-shadow(0 0 6px var(--glow));
    }

    .readout { margin-top: 10px; font-size: 0.82rem; color: #998e84; display: flex; gap: 24px; }
    .readout span { color: var(--glow); font-family: monospace; }
  </style>
</head>
<body>

  <header>
    <h1>Qobyzshy Qobyzdauy</h1>
    <p>Нағыз қобыздау: <strong>Сол қолмен</strong> мойыннан қылды ұстап сырғытыңыз, <strong>Оң қолмен</strong> ысқышты (көлденең таяқшаны) оңға-солға ырғақпен тартыңыз.</p>
    <button class="btn" id="startBtn" onclick="initAudio()">Қобызды Қолға Алу</button>
  </header>

  <div class="qobyz-stage" id="stage">
    <svg class="qobyz-svg" viewBox="0 0 290 480">
      <defs>
        <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#140804"/>
          <stop offset="50%" stop-color="#3d1e10"/>
          <stop offset="100%" stop-color="#140804"/>
        </linearGradient>

        <radialGradient id="bodyCavity" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#0a0402"/>
          <stop offset="75%" stop-color="#241208"/>
          <stop offset="100%" stop-color="#3d1e10"/>
        </radialGradient>

        <radialGradient id="skinGrad" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#c9b095"/>
          <stop offset="80%" stop-color="#8a6e52"/>
          <stop offset="100%" stop-color="#543e2b"/>
        </radialGradient>
      </defs>

      <!-- 1. BASY MEN QUILAQ TUGHYRY -->
      <path d="M 130 12 C 130 4, 160 4, 160 12 L 157 46 L 133 46 Z" fill="url(#woodGrad)" stroke="#090302" stroke-width="1.5"/>
      <rect x="109" y="20" width="22" height="6" rx="2" fill="#0c0503"/>
      <circle cx="107" cy="23" r="5" fill="#241208"/>
      <rect x="159" y="32" width="22" height="6" rx="2" fill="#0c0503"/>
      <circle cx="183" cy="35" r="5" fill="#241208"/>

      <!-- 2. MOJYN (OYNAU AYMAGHY) -->
      <path d="M 133 46 L 129 220 L 161 220 L 157 46 Z" fill="url(#woodGrad)" stroke="#0c0503"/>
      <line x1="135" y1="46" x2="131" y2="220" stroke="#000" opacity="0.6"/>
      <line x1="155" y1="46" x2="159" y2="220" stroke="#000" opacity="0.6"/>

      <!-- 3. SHANAQ (KÖMEJ MEN TUIJE TERISI) -->
      <path d="M 129 220 C 80 210, 55 270, 61 320 C 67 370, 87 450, 125 468 L 165 468 C 203 450, 223 370, 229 320 C 235 270, 210 210, 161 220 Z" fill="url(#woodGrad)" stroke="#090302" stroke-width="2"/>
      <path d="M 145 230 C 120 230, 83 250, 87 295 C 91 335, 125 350, 145 358 C 165 350, 199 335, 203 295 C 207 250, 170 230, 145 230 Z" fill="url(#bodyCavity)" stroke="#000" stroke-width="1.5"/>
      <path d="M 92 330 C 100 330, 125 348, 145 348 C 165 348, 190 330, 198 330 C 203 375, 187 435, 159 456 L 131 456 C 103 435, 87 375, 92 330 Z" fill="url(#skinGrad)" stroke="#3a2517" stroke-width="1.5"/>

      <!-- Tiek pen tuisin -->
      <path d="M 127 378 L 163 378 L 159 388 L 131 388 Z" fill="#080302" stroke="#000" rx="1"/>
      <rect x="137" y="458" width="16" height="14" rx="2" fill="#060201"/>

      <!-- 4. QYLDAR -->
      <line id="line-l" class="string-visual bass" x1="139" y1="24" x2="141" y2="460"/>
      <line id="line-r" class="string-visual" x1="151" y1="36" x2="149" y2="460"/>

      <!-- Tiyisu nukteleri -->
      <ellipse id="dot-l" class="touch-point" cx="140" cy="100" rx="6" ry="3"/>
      <ellipse id="dot-r" class="touch-point" cx="150" cy="100" rx="6" ry="3"/>

      <!-- Sol qolmen basatyn ajmaqtar -->
      <rect id="hit-l" class="string-touch" x="115" y="46" width="30" height="230"/>
      <rect id="hit-r" class="string-touch" x="145" y="46" width="30" height="230"/>

      <!-- 5. INTERAKTIVTI YSQYSH (KÖLDENEÑ QOZGHALATYN SADAT YSQYSH) -->
      <g id="bow-group" transform="translate(0, 310)">
        <!-- Ysqysh saby (Aghash) -->
        <path d="M 20 0 Q 145 -12 270 0 Q 145 -4 20 0 Z" class="bow-stick"/>
        <!-- Ysqyshtyn zhylyqy qyly -->
        <line x1="25" y1="3" x2="265" y2="3" class="bow-string"/>
        <!-- Tutqasy -->
        <rect x="245" y="-8" width="24" height="15" rx="3" fill="#140804" stroke="#543320"/>
      </g>
    </svg>
  </div>

  <div class="readout">
    <div>Сол қол (Иірім): <span id="label-note">Тоғанақ (D3)</span></div>
    <div>Қобыздау (Ысқыш): <span id="label-bow">Тоқтап тұр</span></div>
  </div>

  <script>
    let actx = null;
    let horsehairWave = null;
    let rosinNoise = null;

    function getAudioContext() {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        buildQobyzAcoustics();
      }
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }

    function buildQobyzAcoustics() {
      const harmonics = 40;
      const real = new Float32Array(harmonics);
      const imag = new Float32Array(harmonics);
      real[0] = 0;
      imag[0] = 0;

      for (let n = 1; n < harmonics; n++) {
        let amp = 1 / Math.pow(n, 0.88);
        if (n === 1) amp = 1.0;
        if (n === 2) amp = 0.45;
        if (n >= 3 && n <= 5) amp *= 1.3;
        if (n % 2 !== 0) amp *= 1.2;
        imag[n] = amp;
      }
      horsehairWave = actx.createPeriodicWave(real, imag, { disableNormalization: false });

      const bSize = actx.sampleRate * 2;
      rosinNoise = actx.createBuffer(1, bSize, actx.sampleRate);
      const d = rosinNoise.getChannelData(0);
      for (let i = 0; i < bSize; i++) d[i] = (Math.random() * 2 - 1) * 0.4;
    }

    function initAudio() {
      getAudioContext();
      document.getElementById('stage').classList.add('ready');
      document.getElementById('startBtn').style.display = 'none';
      setupEngineAudio();
    }

    // Negizgi qobyzdygn akustikalyq generatori
    let o1, o2, oSub, lfo, lfoGain, nSrc, nFilter, nGain, masterGain;
    let currentFreq = 146.83; // D3
    let isBass = true;

    function setupEngineAudio() {
      const t = actx.currentTime;

      o1 = actx.createOscillator();
      o2 = actx.createOscillator();
      oSub = actx.createOscillator();

      o1.setPeriodicWave(horsehairWave);
      o2.setPeriodicWave(horsehairWave);
      oSub.type = 'triangle';

      o1.frequency.setValueAtTime(currentFreq, t);
      o2.frequency.setValueAtTime(currentFreq + 0.5, t);
      oSub.frequency.setValueAtTime(currentFreq * 0.5, t);

      lfo = actx.createOscillator();
      lfoGain = actx.createGain();
      lfo.frequency.setValueAtTime(4.4, t);
      lfoGain.gain.setValueAtTime(currentFreq * 0.012, t);
      lfo.connect(o1.frequency);
      lfo.connect(o2.frequency);
      lfo.start(t);

      // Terining kuginirenishti formanttary
      const skinF = actx.createBiquadFilter();
      skinF.type = 'bandpass';
      skinF.frequency.setValueAtTime(320, t);
      skinF.Q.setValueAtTime(3.2, t);

      const cavityF = actx.createBiquadFilter();
      cavityF.type = 'peaking';
      cavityF.frequency.setValueAtTime(540, t);
      cavityF.gain.setValueAtTime(8.0, t);
      cavityF.Q.setValueAtTime(2.0, t);

      const warmF = actx.createBiquadFilter();
      warmF.type = 'lowpass';
      warmF.frequency.setValueAtTime(1850, t);

      // Ysqysh uikeilisi
      nSrc = actx.createBufferSource();
      nSrc.buffer = rosinNoise;
      nSrc.loop = true;

      nFilter = actx.createBiquadFilter();
      nFilter.type = 'bandpass';
      nFilter.frequency.setValueAtTime(currentFreq * 2.4, t);
      nFilter.Q.setValueAtTime(2.5, t);

      nGain = actx.createGain();
      nGain.gain.setValueAtTime(0, t);

      nSrc.connect(nFilter);
      nFilter.connect(nGain);
      nSrc.start(t);

      // Master gain (Tek ysqysh qozghalghanda ghana ashylady!)
      masterGain = actx.createGain();
      masterGain.gain.setValueAtTime(0, t);

      o1.connect(skinF);
      o2.connect(skinF);
      skinF.connect(cavityF);
      cavityF.connect(warmF);

      const subGain = actx.createGain();
      subGain.gain.setValueAtTime(0.3, t);
      oSub.connect(subGain);
      subGain.connect(warmF);

      warmF.connect(masterGain);
      nGain.connect(masterGain);
      masterGain.connect(actx.destination);

      o1.start(t);
      o2.start(t);
      oSub.start(t);
    }

    function setNotePitch(freq, bassMode) {
      currentFreq = freq;
      isBass = bassMode;
      if (!actx || !o1) return;
      const t = actx.currentTime;
      o1.frequency.setTargetAtTime(freq, t, 0.04);
      o2.frequency.setTargetAtTime(freq + (isBass ? 0.42 : 0.65), t, 0.04);
      oSub.frequency.setTargetAtTime(freq * 0.5, t, 0.04);
      lfoGain.gain.setTargetAtTime(freq * 0.012, t, 0.04);
      nFilter.frequency.setTargetAtTime(freq * 2.4, t, 0.04);
    }

    function applyBowMotion(velocity) {
      if (!actx || !masterGain) return;
      const t = actx.currentTime;
      const norm = Math.min(1.0, velocity / 30);

      if (norm > 0.04) {
        const vol = 0.18 + (norm * 0.52);
        masterGain.gain.setTargetAtTime(vol, t, 0.03);
        nGain.gain.setTargetAtTime(norm * 0.05, t, 0.03);
        document.getElementById('label-bow').innerText = `Қобыздалуда (${Math.round(norm * 100)}%)`;
      } else {
        masterGain.gain.setTargetAtTime(0.0001, t, 0.08);
        nGain.gain.setTargetAtTime(0, t, 0.08);
        document.getElementById('label-bow').innerText = 'Тоқтап тұр';
      }
    }

    // 1. SOL QOL: MOJYNDY BASU ZHÄNE IİRİU (FINGER TOUCH & SLIDE)
    const hitL = document.getElementById('hit-l');
    const hitR = document.getElementById('hit-r');
    const dotL = document.getElementById('dot-l');
    const dotR = document.getElementById('dot-r');
    const lineL = document.getElementById('line-l');
    const lineR = document.getElementById('line-r');

    function bindNeckString(hitElem, dotElem, lineElem, baseF, bassMode, sideName) {
      let active = false;

      function getSvgY(e) {
        const svg = document.querySelector('.qobyz-svg');
        const pt = svg.createSVGPoint();
        pt.x = e.touches ? e.touches[0].clientX : e.clientX;
        pt.y = e.touches ? e.touches[0].clientY : e.clientY;
        const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
        return Math.max(46, Math.min(270, svgP.y));
      }

      function onDown(e) {
        e.preventDefault();
        initAudio();
        active = true;
        dotElem.classList.add('active');
        lineElem.classList.add('active');

        const y = getSvgY(e);
        dotElem.setAttribute('cy', y);

        const p = (y - 46) / (270 - 46);
        const f = baseF * Math.pow(2, (p * 14) / 12);
        setNotePitch(f, bassMode);
        document.getElementById('label-note').innerText = `${sideName} (${Math.round(f)} Hz)`;
      }

      function onMove(e) {
        if (!active) return;
        e.preventDefault();
        const y = getSvgY(e);
        dotElem.setAttribute('cy', y);

        const p = (y - 46) / (270 - 46);
        const f = baseF * Math.pow(2, (p * 14) / 12);
        setNotePitch(f, bassMode);
        document.getElementById('label-note').innerText = `${sideName} (${Math.round(f)} Hz)`;
      }

      function onUp() {
        if (active) {
          active = false;
          dotElem.classList.remove('active');
          lineElem.classList.remove('active');
        }
      }

      hitElem.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', (e) => { if(active) onMove(e); });
      window.addEventListener('mouseup', onUp);

      hitElem.addEventListener('touchstart', onDown, {passive: false});
      window.addEventListener('touchmove', (e) => { if(active) onMove(e); }, {passive: false});
      window.addEventListener('touchend', onUp);
    }

    bindNeckString(hitL, dotL, lineL, 146.83, true, 'Тоғанақ');
    bindNeckString(hitR, dotR, lineR, 220.00, false, 'Кілтең');

    // 2. OÑ QOL: YSQYSHTY KÖLDENEÑ TARTU (BOWING ACTION)
    const bowGroup = document.getElementById('bow-group');
    let isBowing = false;
    let lastX = 0;
    let lastTime = performance.now();
    let bowShift = 0;

    function onBowStart(e) {
      e.preventDefault();
      initAudio();
      isBowing = true;
      bowGroup.classList.add('active');
      lastX = e.touches ? e.touches[0].clientX : e.clientX;
      lastTime = performance.now();
    }

    function onBowMove(e) {
      if (!isBowing) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const now = performance.now();
      const dt = now - lastTime;

      if (dt > 12) {
        const dx = clientX - lastX;
        const velocity = (Math.abs(dx) / dt) * 35;

        // Ysqyshtyn SVG ishinde ongha-solgha jylzhuy
        bowShift = Math.max(-40, Math.min(40, bowShift + dx * 0.7));
        bowGroup.setAttribute('transform', `translate(${bowShift}, 310)`);

        applyBowMotion(velocity);

        lastX = clientX;
        lastTime = now;
      }
    }

    function onBowEnd() {
      if (isBowing) {
        isBowing = false;
        bowGroup.classList.remove('active');
        applyBowMotion(0);
      }
    }

    bowGroup.addEventListener('mousedown', onBowStart);
    window.addEventListener('mousemove', onBowMove);
    window.addEventListener('mouseup', onBowEnd);

    bowGroup.addEventListener('touchstart', onBowStart, {passive: false});
    window.addEventListener('touchmove', onBowMove, {passive: false});
    window.addEventListener('touchend', onBowEnd);

    setInterval(() => {
      if (isBowing) {
        if (performance.now() - lastTime > 60) {
          applyBowMotion(0);
        }
      }
    }, 40);
  </script>
</body>
</html>
