<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qobyz.com — Tolyq Qylqobyz Uini</title>
  <style>
    :root {
      --bg: #0b0908;
      --panel: #161210;
      --accent: #d4a373;
      --glow: #ffb852;
      --wood-dark: #221008;
      --wood-mid: #3d1e10;
      --skin: #b89c7d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: #e6e2dd; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; touch-action: none; }

    header { text-align: center; padding: 14px 10px 4px; z-index: 10; }
    h1 { color: var(--accent); letter-spacing: 2px; font-size: 1.45rem; text-transform: uppercase; margin-bottom: 2px; }
    p { color: #8c827a; font-size: 0.82rem; max-width: 480px; }

    .btn-box { margin-top: 8px; display: flex; gap: 8px; justify-content: center; }
    .btn { padding: 7px 18px; background: var(--accent); color: #0b0908; font-weight: 600; font-size: 0.8rem; border: none; border-radius: 4px; cursor: pointer; }
    .btn:hover { background: #faedcd; }
    .btn-hold { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
    .btn-hold.active { background: var(--accent); color: #0b0908; box-shadow: 0 0 12px var(--glow); }

    .qobyz-stage {
      position: relative;
      margin-top: 10px;
      width: 260px;
      height: 480px;
      opacity: 0.4;
      pointer-events: none;
      transition: opacity 0.3s;
      filter: drop-shadow(0 14px 28px rgba(0,0,0,0.85));
    }
    .qobyz-stage.ready { opacity: 1; pointer-events: auto; }

    svg.qobyz-svg { width: 100%; height: 100%; overflow: visible; }

    .string-touch { cursor: pointer; fill: transparent; }
    .string-visual { stroke: #baa592; stroke-width: 2.2; pointer-events: none; }
    .string-visual.bass { stroke-width: 3.6; }

    .string-touch.active + .string-visual {
      stroke: #fff;
      filter: drop-shadow(0 0 6px var(--glow));
    }

    .touch-point { fill: #fff; filter: drop-shadow(0 0 8px var(--glow)); opacity: 0; pointer-events: none; }
    .touch-point.active { opacity: 1; }

    .readout { margin-top: 10px; font-size: 0.82rem; color: #998e84; display: flex; gap: 24px; }
    .readout span { color: var(--glow); font-family: monospace; }
  </style>
</head>
<body>

  <header>
    <h1>Qylqobyz Uini</h1>
    <p>Qyl shoghyrynygn fazalyq qalyndyghy men terining kuginirenisine qurylghan akustikalyq model.</p>
    <div class="btn-box">
      <button class="btn" id="startBtn" onclick="initAudio()">Қобызды Қосу</button>
      <button class="btn btn-hold" id="holdBtn" onclick="toggleHold()">Тоғанақты бекіту (Hold)</button>
    </div>
  </header>

  <div class="qobyz-stage" id="stage">
    <svg class="qobyz-svg" viewBox="0 0 260 480">
      <defs>
        <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#140804"/>
          <stop offset="50%" stop-color="#3d1e10"/>
          <stop offset="100%" stop-color="#140804"/>
        </linearGradient>

        <radialGradient id="bodyCavity" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#0a0402"/>
          <stop offset="75%" stop-color="#241208"/>
          <stop offset="100%" stop-color="#3d1e10"/>
        </radialGradient>

        <radialGradient id="skinGrad" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#c9b095"/>
          <stop offset="80%" stop-color="#8a6e52"/>
          <stop offset="100%" stop-color="#543e2b"/>
        </radialGradient>
      </defs>

      <!-- Basy men quilaqtary -->
      <path d="M 115 12 C 115 4, 145 4, 145 12 L 142 46 L 118 46 Z" fill="url(#woodGrad)" stroke="#090302" stroke-width="1.5"/>
      <rect x="94" y="20" width="22" height="6" rx="2" fill="#0c0503"/>
      <circle cx="92" cy="23" r="5" fill="#241208"/>
      <rect x="144" y="32" width="22" height="6" rx="2" fill="#0c0503"/>
      <circle cx="168" cy="35" r="5" fill="#241208"/>

      <!-- Mojyn -->
      <path d="M 118 46 L 114 220 L 146 220 L 142 46 Z" fill="url(#woodGrad)" stroke="#0c0503"/>
      <line x1="120" y1="46" x2="116" y2="220" stroke="#000" opacity="0.6"/>
      <line x1="140" y1="46" x2="144" y2="220" stroke="#000" opacity="0.6"/>

      <!-- Shanaq zhaine terisi -->
      <path d="M 114 220 C 65 210, 40 270, 46 320 C 52 370, 72 450, 110 468 L 150 468 C 188 450, 208 370, 214 320 C 220 270, 195 210, 146 220 Z" fill="url(#woodGrad)" stroke="#090302" stroke-width="2"/>
      <path d="M 130 230 C 105 230, 68 250, 72 295 C 76 335, 110 350, 130 358 C 150 350, 184 335, 188 295 C 192 250, 155 230, 130 230 Z" fill="url(#bodyCavity)" stroke="#000" stroke-width="1.5"/>
      <path d="M 77 330 C 85 330, 110 348, 130 348 C 150 348, 175 330, 183 330 C 188 375, 172 435, 144 456 L 116 456 C 88 435, 72 375, 77 330 Z" fill="url(#skinGrad)" stroke="#3a2517" stroke-width="1.5"/>

      <!-- Tiek pen tuisin -->
      <path d="M 112 378 L 148 378 L 144 388 L 116 388 Z" fill="#080302" stroke="#000" rx="1"/>
      <rect x="122" y="458" width="16" height="14" rx="2" fill="#060201"/>

      <!-- Qyldar -->
      <line id="line-l" class="string-visual bass" x1="124" y1="24" x2="126" y2="460"/>
      <line id="line-r" class="string-visual" x1="136" y1="36" x2="134" y2="460"/>

      <!-- Tiysu nukteleri -->
      <ellipse id="dot-l" class="touch-point" cx="125" cy="100" rx="6" ry="3"/>
      <ellipse id="dot-r" class="touch-point" cx="135" cy="100" rx="6" ry="3"/>

      <!-- Basatyn ajmaqtar -->
      <rect id="hit-l" class="string-touch" x="100" y="46" width="30" height="240"/>
      <rect id="hit-r" class="string-touch" x="130" y="46" width="30" height="240"/>
    </svg>
  </div>

  <div class="readout">
    <div>Тоғанақ (D3): <span id="label-l">—</span></div>
    <div>Кілтең (A3): <span id="label-r">—</span></div>
  </div>

  <script>
    let actx = null;
    let horsehairWave = null;
    let rosinNoise = null;

    function getAudioContext() {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        buildQobyzAcoustics();
      }
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }

    // 1. Qobyz qylynygn kuginirenishti tolqyn spektrin kuru
    function buildQobyzAcoustics() {
      const harmonics = 40;
      const real = new Float32Array(harmonics);
      const imag = new Float32Array(harmonics);
      real[0] = 0;
      imag[0] = 0;

      // Qobyzgha tan: 1-shi fundamental kuitli, 2-shi men 3-shi zhumsaryp, 4-6 arasy kuginireu beredi
      for (let n = 1; n < harmonics; n++) {
        let amp = 1 / Math.pow(n, 0.88);
        if (n === 1) amp = 1.0;
        if (n === 2) amp = 0.45;
        if (n >= 3 && n <= 5) amp *= 1.25; // Toghanaq terendigi
        if (n % 2 !== 0) amp *= 1.15;
        imag[n] = amp;
      }
      horsehairWave = actx.createPeriodicWave(real, imag, { disableNormalization: false });

      // Ysqysh pen qyl shajyrynyn shuyly (Rosin friction)
      const bSize = actx.sampleRate * 2;
      rosinNoise = actx.createBuffer(1, bSize, actx.sampleRate);
      const d = rosinNoise.getChannelData(0);
      for (let i = 0; i < bSize; i++) d[i] = (Math.random() * 2 - 1) * 0.35;
    }

    function initAudio() {
      getAudioContext();
      document.getElementById('stage').classList.add('ready');
      document.getElementById('startBtn').style.display = 'none';
    }

    // 2. Tughna kuginirenishti qobyz dybysyn shygharatyn klass
    class RealDeepQobyzVoice {
      constructor(baseFreq) {
        this.baseFreq = baseFreq;
        this.ctx = getAudioContext();
        this.nodes = null;
      }

      play(freq, isBass = false) {
        this.stop();
        const t = this.ctx.currentTime;

        // Qos qyl tolqyndary: 3 fazalyq generator (qyl shoghyrynyn chorusing qasieti)
        const o1 = this.ctx.createOscillator();
        const o2 = this.ctx.createOscillator();
        const oSub = this.ctx.createOscillator();

        o1.setPeriodicWave(horsehairWave);
        o2.setPeriodicWave(horsehairWave);
        oSub.type = 'triangle'; // Tubindegi togany kuginirentin bas

        o1.frequency.setValueAtTime(freq, t);
        o2.frequency.setValueAtTime(freq + (isBass ? 0.42 : 0.65), t);
        oSub.frequency.setValueAtTime(freq * 0.5, t); // Sub-harmonic

        // Niazik vibrato (qol diriuli)
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        lfo.frequency.setValueAtTime(isBass ? 3.9 : 4.8, t);
        lfoGain.gain.setValueAtTime(freq * 0.013, t);
        lfo.connect(o1.frequency);
        lfo.connect(o2.frequency);
        lfo.start(t);

        // KUGINIREU FORMANTTARY (Terining asimmetriyalyq rezonansy)
        // 1. Tuiye terisi (F1 = 320 Hz)
        const skinF = this.ctx.createBiquadFilter();
        skinF.type = 'bandpass';
        skinF.frequency.setValueAtTime(320, t);
        skinF.Q.setValueAtTime(3.2, t);

        // 2. Shanaqtyn ashyq quysy (F2 = 540 Hz)
        const cavityF = this.ctx.createBiquadFilter();
        cavityF.type = 'peaking';
        cavityF.frequency.setValueAtTime(540, t);
        cavityF.gain.setValueAtTime(8.0, t);
        cavityF.Q.setValueAtTime(2.0, t);

        // 3. Zhogharghy qattylyqty zhumsartu (Lowpass 1850 Hz)
        const warmF = this.ctx.createBiquadFilter();
        warmF.type = 'lowpass';
        warmF.frequency.setValueAtTime(1850, t);

        // Ysqyshtyng qylgha uikeilisi (Friction noise)
        const nSrc = this.ctx.createBufferSource();
        nSrc.buffer = rosinNoise;
        nSrc.loop = true;

        const nFilter = this.ctx.createBiquadFilter();
        nFilter.type = 'bandpass';
        nFilter.frequency.setValueAtTime(freq * 2.4, t);
        nFilter.Q.setValueAtTime(2.5, t);

        const nGain = this.ctx.createGain();
        nGain.gain.setValueAtTime(0.038, t);

        nSrc.connect(nFilter);
        nFilter.connect(nGain);
        nSrc.start(t);

        // Dinamikalyq envelope: bastalu crescendosy
        const subGain = this.ctx.createGain();
        subGain.gain.setValueAtTime(isBass ? 0.35 : 0.2, t);

        const mainGain = this.ctx.createGain();
        mainGain.gain.setValueAtTime(0.001, t);
        mainGain.gain.exponentialRampToValueAtTime(isBass ? 0.38 : 0.44, t + 0.13);

        // Kosylu zhelisi
        o1.connect(skinF);
        o2.connect(skinF);
        skinF.connect(cavityF);
        cavityF.connect(warmF);

        oSub.connect(subGain);
        subGain.connect(warmF);

        warmF.connect(mainGain);
        nGain.connect(mainGain);

        mainGain.connect(this.ctx.destination);

        o1.start(t);
        o2.start(t);
        oSub.start(t);

        this.nodes = { o1, o2, oSub, lfo, lfoGain, nFilter, nSrc, mainGain };
      }

      setPitch(freq) {
        if (!this.nodes) return;
        const t = this.ctx.currentTime;
        this.nodes.o1.frequency.setTargetAtTime(freq, t, 0.045);
        this.nodes.o2.frequency.setTargetAtTime(freq + 0.55, t, 0.045);
        this.nodes.oSub.frequency.setTargetAtTime(freq * 0.5, t, 0.045);
        this.nodes.lfoGain.gain.setTargetAtTime(freq * 0.013, t, 0.045);
        this.nodes.nFilter.frequency.setTargetAtTime(freq * 2.4, t, 0.045);
      }

      stop() {
        if (!this.nodes) return;
        const t = this.ctx.currentTime;
        const n = this.nodes;
        n.mainGain.gain.cancelScheduledValues(t);
        n.mainGain.gain.linearRampToValueAtTime(0.0001, t + 0.18);
        setTimeout(() => {
          try {
            n.o1.stop();
            n.o2.stop();
            n.oSub.stop();
            n.lfo.stop();
            n.nSrc.stop();
          } catch(e){}
        }, 220);
        this.nodes = null;
      }
    }

    const bass = new RealDeepQobyzVoice(146.83); // D3
    const treble = new RealDeepQobyzVoice(220.00); // A3

    let isHold = false;
    function toggleHold() {
      initAudio();
      isHold = !isHold;
      const btn = document.getElementById('holdBtn');
      const dotL = document.getElementById('dot-l');
      const labelL = document.getElementById('label-l');

      if (isHold) {
        btn.classList.add('active');
        dotL.classList.add('active');
        dotL.setAttribute('cy', 50);
        bass.play(146.83, true);
        labelL.innerText = '147 Hz [Hold]';
      } else {
        btn.classList.remove('active');
        dotL.classList.remove('active');
        bass.stop();
        labelL.innerText = '—';
      }
    }

    // Interaktivti qoldau
    const hitL = document.getElementById('hit-l');
    const hitR = document.getElementById('hit-r');
    const dotL = document.getElementById('dot-l');
    const dotR = document.getElementById('dot-r');

    function setupStringInteraction(hitElem, dotElem, inst, side, isBass) {
      let isDown = false;

      function getSvgY(e) {
        const svg = document.querySelector('.qobyz-svg');
        const pt = svg.createSVGPoint();
        pt.x = e.touches ? e.touches[0].clientX : e.clientX;
        pt.y = e.touches ? e.touches[0].clientY : e.clientY;
        const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
        return Math.max(46, Math.min(280, svgP.y));
      }

      function start(e) {
        e.preventDefault();
        initAudio();
        isDown = true;
        hitElem.classList.add('active');
        dotElem.classList.add('active');

        const y = getSvgY(e);
        dotElem.setAttribute('cy', y);

        const percent = (y - 46) / (280 - 46);
        const freq = inst.baseFreq * Math.pow(2, (percent * 14) / 12);
        inst.play(freq, isBass);

        document.getElementById(`label-${side}`).innerText = Math.round(freq) + ' Hz';
      }

      function move(e) {
        if (!isDown) return;
        e.preventDefault();
        const y = getSvgY(e);
        dotElem.setAttribute('cy', y);

        const percent = (y - 46) / (280 - 46);
        const freq = inst.baseFreq * Math.pow(2, (percent * 14) / 12);
        inst.setPitch(freq);

        document.getElementById(`label-${side}`).innerText = Math.round(freq) + ' Hz';
      }

      function end(e) {
        if (isDown) {
          isDown = false;
          hitElem.classList.remove('active');
          if (!(side === 'l' && isHold)) {
            dotElem.classList.remove('active');
            inst.stop();
            document.getElementById(`label-${side}`).innerText = '—';
          }
        }
      }

      hitElem.addEventListener('mousedown', start);
      window.addEventListener('mousemove', (e) => { if(isDown) move(e); });
      window.addEventListener('mouseup', end);

      hitElem.addEventListener('touchstart', start, {passive: false});
      window.addEventListener('touchmove', (e) => { if(isDown) move(e); }, {passive: false});
      window.addEventListener('touchend', end);
    }

    setupStringInteraction(hitL, dotL, bass, 'l', true);
    setupStringInteraction(hitR, dotR, treble, 'r', false);
  </script>
</body>
</html>
