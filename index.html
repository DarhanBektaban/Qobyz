<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qobyz.com — Qos Sauusaqpen Uindetuu</title>
  <style>
    :root {
      --bg: #090807;
      --panel: #161210;
      --accent: #d4a373;
      --accent-glow: #ffc872;
      --wood: #1e0d07;
      --skin: #c2a688;
      --border: #28201b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: #e6e2dd; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; touch-action: none; }

    header { text-align: center; padding: 18px 12px 10px; z-index: 10; }
    h1 { color: var(--accent); letter-spacing: 2px; font-size: 1.6rem; text-transform: uppercase; margin-bottom: 4px; }
    p { color: #8c827a; font-size: 0.88rem; max-width: 500px; line-height: 1.4; }

    .btn-box {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      padding: 9px 20px;
      background: var(--accent);
      color: #0c0a09;
      font-weight: 600;
      font-size: 0.85rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn:hover { background: #faedcd; }

    .btn-hold {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .btn-hold.active {
      background: var(--accent);
      color: #0c0a09;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Qobyz Korpusy */
    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 12px;
      opacity: 0.35;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .stage.ready { opacity: 1; pointer-events: auto; }

    .qobyz-head {
      width: 52px;
      height: 72px;
      background: #150905;
      border-radius: 10px 10px 0 0;
      position: relative;
    }
    .peg { width: 14px; height: 8px; background: #050201; position: absolute; }
    .peg.l { left: -10px; top: 20px; }
    .peg.r { right: -10px; top: 40px; }

    .qobyz-neck {
      width: 56px;
      height: 380px;
      background: linear-gradient(90deg, #110603, #220e07, #110603);
      position: relative;
      box-shadow: inset 0 0 16px rgba(0,0,0,0.9);
    }

    .qobyz-body {
      width: 220px;
      height: 270px;
      background: radial-gradient(circle at 50% 30%, #36190e, #110603 85%);
      border-radius: 42% 42% 46% 46%;
      margin-top: -24px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 20px;
      position: relative;
    }

    .qobyz-skin {
      width: 168px;
      height: 146px;
      background: radial-gradient(circle, var(--skin), #826850);
      border-radius: 12px 12px 46% 46%;
      position: relative;
    }

    .qobyz-bridge {
      width: 44px;
      height: 14px;
      background: #0f0603;
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 3px;
    }

    /* Qos Qyl Zholynyn Qurylymy */
    .touch-lane {
      position: absolute;
      top: 0;
      height: 100%;
      width: 28px;
      cursor: pointer;
      display: flex;
      justify-content: center;
    }
    .touch-lane.l { left: 0; }
    .touch-lane.r { right: 0; }

    .wire {
      width: 4px;
      height: 480px;
      background: #b5a290;
      position: absolute;
      top: -24px;
      pointer-events: none;
      transition: width 0.1s;
    }
    .wire.bass { width: 6px; }

    .touch-lane.active .wire {
      background: #fff;
      box-shadow: 0 0 15px var(--accent-glow);
      width: 6.5px;
    }

    .touch-indicator {
      width: 18px;
      height: 9px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      opacity: 0;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .touch-lane.active .touch-indicator { opacity: 1; }

    .readout {
      margin-top: 14px;
      display: flex;
      gap: 20px;
      font-size: 0.85rem;
      color: #998e84;
    }
    .readout span { color: var(--accent-glow); font-family: monospace; }
  </style>
</head>
<body>

  <header>
    <h1>QOS SAUUSAQ SARYNY</h1>
    <p>Бір саусақпен төменгі қылды басып үнді ұстаңыз, екінші саусақпен жоғарғы қылды сырғытып әуендетіңіз.</p>
    
    <div class="btn-box">
      <button class="btn" id="startBtn" onclick="initSystem()">Дыбысты Қосу</button>
      <button class="btn btn-hold" id="holdBtn" onclick="toggleDroneHold()">Сол қылды бекіту (Hold)</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="qobyz-head">
      <div class="peg l"></div>
      <div class="peg r"></div>
    </div>
    
    <div class="qobyz-neck" id="neck">
      <!-- Сол қыл: Ұстап тұратын тұрақты үн (D3) -->
      <div class="touch-lane l" id="lane-l">
        <div class="wire bass"></div>
        <div class="touch-indicator" id="ind-l"></div>
      </div>
      <!-- Оң қыл: Үндейтін, құбылатын әуен (A3) -->
      <div class="touch-lane r" id="lane-r">
        <div class="wire"></div>
        <div class="touch-indicator" id="ind-r"></div>
      </div>
    </div>

    <div class="qobyz-body">
      <div class="qobyz-skin">
        <div class="qobyz-bridge"></div>
      </div>
    </div>
  </div>

  <div class="readout">
    <div>Тұрақты сарын: <span id="label-l">—</span></div>
    <div>Әуендеу: <span id="label-r">—</span></div>
  </div>

  <script>
    let actx = null;

    function getAudioContext() {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }

    function initSystem() {
      getAudioContext();
      document.getElementById('stage').classList.add('ready');
      document.getElementById('startBtn').style.display = 'none';
    }

    // Қылқобыз үнінің акустикалық генераторы
    class StringVoice {
      constructor(baseFreq) {
        this.baseFreq = baseFreq;
        this.ctx = getAudioContext();
        this.voice = null;
      }

      play(freq, isDrone = false) {
        this.stop();
        const t = this.ctx.currentTime;

        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        osc1.type = 'sawtooth';
        osc2.type = 'sawtooth';
        osc1.frequency.setValueAtTime(freq, t);
        osc2.frequency.setValueAtTime(freq + 0.7, t); // Қыл шоғырының қалыңдығы

        // Үндеу кезіндегі қол дірілі (Вибрато)
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        lfo.frequency.setValueAtTime(isDrone ? 3.5 : 4.8, t);
        lfoGain.gain.setValueAtTime(freq * (isDrone ? 0.008 : 0.016), t);
        lfo.connect(osc1.frequency);
        lfo.connect(osc2.frequency);
        lfo.start(t);

        // Қобыз шанағының түпкі форманты
        const body = this.ctx.createBiquadFilter();
        body.type = 'bandpass';
        body.frequency.setValueAtTime(420, t);
        body.Q.setValueAtTime(2.4, t);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.exponentialRampToValueAtTime(isDrone ? 0.28 : 0.38, t + 0.1);

        osc1.connect(body);
        osc2.connect(body);
        body.connect(gain);
        gain.connect(this.ctx.destination);

        osc1.start(t);
        osc2.start(t);

        this.voice = { osc1, osc2, lfo, gain, lfoGain };
      }

      setPitch(freq) {
        if (!this.voice) return;
        const t = this.ctx.currentTime;
        this.voice.osc1.frequency.setTargetAtTime(freq, t, 0.04);
        this.voice.osc2.frequency.setTargetAtTime(freq + 0.7, t, 0.04);
        this.voice.lfoGain.gain.setTargetAtTime(freq * 0.016, t, 0.04);
      }

      stop() {
        if (!this.voice) return;
        const t = this.ctx.currentTime;
        const v = this.voice;
        v.gain.linearRampToValueAtTime(0.0001, t + 0.16);
        setTimeout(() => {
          try { v.osc1.stop(); v.osc2.stop(); v.lfo.stop(); } catch(e){}
        }, 200);
        this.voice = null;
      }
    }

    const bassString = new StringVoice(146.83); // D3 (Тоғанақ)
    const melodyString = new StringVoice(220.00); // A3 (Кілтең)

    let isDroneLocked = false;

    // Тінтуір үшін «Сол қылды бекіту» батырмасы
    function toggleDroneHold() {
      initSystem();
      isDroneLocked = !isDroneLocked;
      const btn = document.getElementById('holdBtn');
      const laneL = document.getElementById('lane-l');
      const labelL = document.getElementById('label-l');

      if (isDroneLocked) {
        btn.classList.add('active');
        laneL.classList.add('active');
        bassString.play(146.83, true);
        labelL.innerText = 'D3 (147 Hz) [Бекітілді]';
      } else {
        btn.classList.remove('active');
        laneL.classList.remove('active');
        bassString.stop();
        labelL.innerText = '—';
      }
    }

    // MULTI-TOUCH ҚОЛДАУЫ: Екі саусақпен қатар басқару
    const activeTouches = {};

    function calcFreq(y, h, baseFreq) {
      const p = Math.max(0, Math.min(1, y / h));
      return baseFreq * Math.pow(2, (p * 14) / 12);
    }

    function setupMultiTouch() {
      const neck = document.getElementById('neck');

      neck.addEventListener('touchstart', (e) => {
        e.preventDefault();
        initSystem();
        const rect = neck.getBoundingClientRect();

        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          const x = t.clientX - rect.left;
          const y = t.clientY - rect.top;

          // Сол жақ па, әлде оң жақ қыл ма?
          const isLeft = x < rect.width / 2;
          const side = isLeft ? 'l' : 'r';
          const stringInst = isLeft ? bassString : melodyString;

          activeTouches[t.identifier] = { side, stringInst };

          const f = calcFreq(y, rect.height, stringInst.baseFreq);
          stringInst.play(f, isLeft);

          document.getElementById(`lane-${side}`).classList.add('active');
          const ind = document.getElementById(`ind-${side}`);
          ind.style.top = y + 'px';
          document.getElementById(`label-${side}`).innerText = Math.round(f) + ' Hz';
        }
      }, { passive: false });

      neck.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const rect = neck.getBoundingClientRect();

        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          const item = activeTouches[t.identifier];
          if (item) {
            const y = Math.max(0, Math.min(rect.height, t.clientY - rect.top));
            const f = calcFreq(y, rect.height, item.stringInst.baseFreq);
            item.stringInst.setPitch(f);

            document.getElementById(`ind-${item.side}`).style.top = y + 'px';
            document.getElementById(`label-${item.side}`).innerText = Math.round(f) + ' Hz';
          }
        }
      }, { passive: false });

      function endTouch(e) {
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          const item = activeTouches[t.identifier];
          if (item) {
            if (!(item.side === 'l' && isDroneLocked)) {
              item.stringInst.stop();
              document.getElementById(`lane-${item.side}`).classList.remove('active');
              document.getElementById(`label-${item.side}`).innerText = '—';
            }
            delete activeTouches[t.identifier];
          }
        }
      }

      neck.addEventListener('touchend', endTouch);
      neck.addEventListener('touchcancel', endTouch);

      // Компьютерде Тінтуірмен (Mouse) ойнау: Оң ішекпен үндеу
      const laneR = document.getElementById('lane-r');
      let mousePlaying = false;

      laneR.addEventListener('mousedown', (e) => {
        e.preventDefault();
        initSystem();
        mousePlaying = true;
        laneR.classList.add('active');
        const rect = laneR.getBoundingClientRect();
        const y = e.clientY - rect.top;
        const f = calcFreq(y, rect.height, melodyString.baseFreq);
        melodyString.play(f, false);
        document.getElementById('ind-r').style.top = y + 'px';
        document.getElementById('label-r').innerText = Math.round(f) + ' Hz';
      });

      window.addEventListener('mousemove', (e) => {
        if (!mousePlaying) return;
        const rect = laneR.getBoundingClientRect();
        const y = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
        const f = calcFreq(y, rect.height, melodyString.baseFreq);
        melodyString.setPitch(f);
        document.getElementById('ind-r').style.top = y + 'px';
        document.getElementById('label-r').innerText = Math.round(f) + ' Hz';
      });

      window.addEventListener('mouseup', () => {
        if (mousePlaying) {
          mousePlaying = false;
          laneR.classList.remove('active');
          melodyString.stop();
          document.getElementById('label-r').innerText = '—';
        }
      });
    }

    setupMultiTouch();
  </script>
</body>
</html>
